<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OurMoney">
<meta name="theme-color" content="#131016">
<title>OurMoney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<!--
  App chrome is self-contained. Payslip OCR loads pdf.js / Tesseract from a
  CDN only after the user taps «הוספת תלוש». Guest data lives in data.js.
-->
<style>
/* ============================================================ design system
   «Midnight plum & champagne» — deep plum-ink surfaces, champagne-gold brand,
   rose accent. Heebo carries the UI; Frank Ruhl Libre marks the wordmark and
   the hero. All colors flow from these tokens — the JS reads them too. */
:root{
  --bg:#131016; --bg-elev:#191521; --card:#1d1826; --card-2:#272033;
  --line:#332b42; --line-2:#463b58;
  --ink:#f3eef8; --ink-2:#c8bdd6; --ink-3:#9b8fa8;
  --brand:#e2ba7f; --brand-2:#f0d6a8; --brand-dim:rgba(226,186,127,.14);
  --on-brand:#221809;
  --good:#79c692; --good-2:#a5e0b8; --good-dim:rgba(121,198,146,.14);
  --bad:#e28379; --bad-2:#f2a89f; --bad-dim:rgba(226,131,121,.14);
  --warn:#dfb066; --warn-2:#efd095; --warn-dim:rgba(223,176,102,.14);
  --plum:#d795a8;
  --r:12px; --r-lg:18px; --r-xl:26px;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 20px 50px -20px rgba(0,0,0,.55);
  --tap:44px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
:root[data-theme="light"]{
  --bg:#f8f3ee; --bg-elev:#fffdfb; --card:#fffdfb; --card-2:#f1e9e2;
  --line:#e7dcd2; --line-2:#d6c7ba;
  --ink:#2a2230; --ink-2:#585062; --ink-3:#7d7488;
  --brand:#8a6224; --brand-2:#6f4e1d; --brand-dim:rgba(138,98,36,.11);
  --on-brand:#fff9f2;
  --good:#2f6b4a; --good-2:#25573b; --good-dim:rgba(47,107,74,.11);
  --bad:#b2423c; --bad-2:#8f322d; --bad-dim:rgba(178,66,60,.11);
  --warn:#8a6224; --warn-2:#6f4e1d; --warn-dim:rgba(138,98,36,.11);
  --plum:#96586c;
  --shadow:0 1px 2px rgba(42,34,48,.05),0 16px 36px -18px rgba(42,34,48,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* Any element wider than the viewport makes iOS scale the layout viewport,
   which pushes the fixed bottom nav off screen. clip, not hidden: hidden
   turns body into a scroll container and breaks position:sticky. */
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
body{
  font-family:"Heebo",-apple-system,BlinkMacSystemFont,"SF Hebrew","Arial Hebrew",
              "Segoe UI",Rubik,Arial,sans-serif;
  background:
    radial-gradient(900px 480px at 12% -8%, var(--brand-dim), transparent 58%),
    radial-gradient(700px 420px at 110% 8%, color-mix(in srgb,var(--plum) 16%,transparent), transparent 52%),
    var(--bg);
  color:var(--ink);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
@media(min-width:860px){body{padding-bottom:2rem}}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--brand-2)}
::selection{background:color-mix(in srgb,var(--brand) 32%,transparent)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ==================================================================== chrome */
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
  padding:calc(.55rem + env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) .55rem max(1rem,env(safe-area-inset-left));
  display:flex; align-items:center; gap:.75rem;
}
.brand{
  font-family:"Frank Ruhl Libre",Georgia,serif;
  font-weight:900;font-size:1.08rem;letter-spacing:.01em;white-space:nowrap;
  background:linear-gradient(100deg,var(--brand-2),var(--brand) 55%,var(--plum));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand small{
  display:block;font-family:"Heebo",-apple-system,sans-serif;font-weight:500;
  font-size:.68rem;color:var(--ink-3);letter-spacing:0;
  -webkit-text-fill-color:var(--ink-3);
}
.countdown{
  margin-inline-start:auto; display:flex; align-items:baseline; gap:.35rem;
  background:var(--brand-dim); border:1px solid color-mix(in srgb,var(--brand) 32%,transparent);
  color:var(--brand-2); padding:.3rem .7rem; border-radius:999px;
  font-weight:700; font-size:.82rem; white-space:nowrap;
}
.countdown b{font-size:1rem}
/* The topbar is the one row that must never wrap: brand + pill + up to three
   icon buttons overflow 375px unless everything shrinks together. */
@media(max-width:600px){
  .topbar{gap:.45rem}
  .brand{font-size:.98rem}
  .brand small{display:none}
  .iconbtn{width:38px}
  .countdown{font-size:.74rem;padding:.25rem .55rem}
  .cd-x{display:none}
}
/* stacked mobile row replacing a wide table row */
.grow{padding:.65rem 0;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:none}
.iconbtn{
  width:var(--tap);height:36px;display:grid;place-items:center;border-radius:var(--r);
  color:var(--ink-2);border:1px solid var(--line);background:var(--card);
  transition:color .18s var(--ease),border-color .18s var(--ease),background .18s var(--ease);
}
.iconbtn:hover{color:var(--brand-2);border-color:var(--line-2);background:var(--card-2)}
.iconbtn:active{transform:scale(.94)}

/* desktop tabs */
.tabs{
  display:none; gap:2px; padding:.3rem; margin:1rem auto 0; max-width:1180px;
  background:color-mix(in srgb,var(--card) 82%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}
@media(min-width:860px){.tabs{display:flex}}
.tabs button{
  flex:1; padding:.6rem .5rem; border-radius:calc(var(--r-lg) - 5px);
  font-weight:600; font-size:.85rem; color:var(--ink-3);
  transition:color .18s var(--ease),background .18s var(--ease);
}
.tabs button:hover{color:var(--ink-2);background:var(--card-2)}
.tabs button[aria-selected="true"]{
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  color:var(--on-brand);font-weight:700;
  box-shadow:0 2px 10px -2px color-mix(in srgb,var(--brand) 45%,transparent);
}

/* mobile bottom nav */
.botnav{
  position:fixed; inset-inline:0; bottom:0; z-index:50;
  display:flex;
  background:color-mix(in srgb,var(--bg-elev) 92%,transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:860px){.botnav{display:none}}
.botnav button{
  flex:1; margin:.3rem .25rem; padding:.35rem .1rem .3rem;
  display:flex; flex-direction:column;
  align-items:center; gap:2px; font-size:.62rem; font-weight:600;
  color:var(--ink-3); min-height:var(--tap); border-radius:12px;
  transition:color .18s var(--ease),background .18s var(--ease);
}
.botnav button svg{width:21px;height:21px}
.botnav button:active{transform:scale(.93)}
.botnav button[aria-selected="true"]{
  color:var(--brand-2);background:var(--brand-dim);font-weight:700;
}

.wrap{max-width:1180px;margin:0 auto;padding:1rem max(.85rem,env(safe-area-inset-right)) 1rem max(.85rem,env(safe-area-inset-left))}
.view{display:none;animation:in .26s var(--ease)}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =================================================================== pieces */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.card+.card{margin-top:.85rem}
.card-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.85rem;flex-wrap:wrap}
.card-h h2{font-size:.78rem;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.card-h .sp{margin-inline-start:auto}
.dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}

.grid{display:grid;gap:.7rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}

.stat{
  background:linear-gradient(165deg,color-mix(in srgb,var(--c,var(--brand)) 7%,var(--card)),var(--card) 55%);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem .95rem;position:relative;overflow:hidden;
  transition:border-color .18s var(--ease),transform .18s var(--ease);
}
.stat::before{
  content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;
  background:linear-gradient(180deg,var(--c,var(--brand)),color-mix(in srgb,var(--c,var(--brand)) 35%,transparent));
}
.stat .k{font-size:.72rem;color:var(--ink-3);font-weight:600;margin-bottom:.3rem}
.stat .v{font-size:1.42rem;font-weight:800;letter-spacing:-.02em;color:var(--c,var(--ink));font-variant-numeric:tabular-nums}
.stat .s{font-size:.7rem;color:var(--ink-3);margin-top:.15rem}
@media(max-width:520px){.stat .v{font-size:1.22rem}}
button.stat{font:inherit;color:inherit;text-align:start;width:100%}
@media(hover:hover){
  button.stat:hover{border-color:var(--line-2);transform:translateY(-1px)}
}
button.stat[aria-pressed="true"]{outline:2px solid var(--c,var(--brand));outline-offset:1px}

.bar{height:9px;border-radius:99px;background:var(--card-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{
  padding:.32rem .7rem;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-2);font-size:.78rem;font-weight:600;
  white-space:nowrap; min-height:32px;
  transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  border-color:transparent;color:var(--on-brand);font-weight:700;
}
.chip.sm{font-size:.7rem;padding:.15rem .5rem;min-height:0}

.tag{display:inline-block;padding:.12rem .48rem;border-radius:6px;font-size:.68rem;font-weight:700;white-space:nowrap}
.t-good{background:var(--good-dim);color:var(--good-2)}
.t-bad{background:var(--bad-dim);color:var(--bad-2)}
.t-warn{background:var(--warn-dim);color:var(--warn-2)}
.t-mute{background:var(--card-2);color:var(--ink-3)}
.t-brand{background:var(--brand-dim);color:var(--brand-2)}

.btn{
  padding:.55rem 1.1rem;border-radius:var(--r);font-weight:700;font-size:.85rem;
  border:1px solid transparent;min-height:38px;
  transition:filter .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn-p{
  background:linear-gradient(135deg,var(--brand-2),var(--brand));color:var(--on-brand);
  box-shadow:0 2px 12px -3px color-mix(in srgb,var(--brand) 50%,transparent);
}
.btn-p:hover{filter:brightness(1.07)}
.btn-o{border-color:var(--line-2);color:var(--ink-2);background:var(--card)}
.btn-o:hover{border-color:var(--brand);color:var(--brand-2)}
.btn-d{border-color:var(--line-2);color:var(--bad-2);background:var(--card)}
.btn-d:hover{border-color:var(--bad);background:var(--bad-dim)}
.btn.sm{padding:.3rem .7rem;font-size:.76rem;min-height:32px}

input[type=text],input[type=number],input[type=search],input[type=date],input[type=tel],select,textarea{
  width:100%;padding:.5rem .65rem;background:var(--bg-elev);border:1px solid var(--line-2);
  border-radius:var(--r);outline:none;font-size:.88rem;min-height:38px;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-dim)}
input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;padding:0;border:none;
  background:var(--line-2);border-radius:99px;min-height:0;box-shadow:none
}
input[type=range]:focus{box-shadow:none}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));border:3px solid var(--bg);cursor:pointer;
  box-shadow:0 1px 6px rgba(0,0,0,.4)
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--brand);
  border:3px solid var(--bg);cursor:pointer
}
label.fld{display:block}
label.fld span{display:block;font-size:.7rem;color:var(--ink-3);font-weight:600;margin-bottom:.25rem}
/* iOS zooms the whole page when focusing any input whose font is under 16px,
   and the zoom sticks -- that is the sideways scrolling on the phone.
   Must come after the base input rules above to win the cascade. */
@media(max-width:680px){
  input[type=text],input[type=number],input[type=search],input[type=date],input[type=tel],select,textarea{font-size:16px}
  details.acc table{font-size:.76rem}
  details.acc td,details.acc th{padding:.4rem .35rem}
}

.search{position:relative}
.search svg{position:absolute;inset-inline-start:.6rem;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.search input{padding-inline-start:2.1rem}

/* tables */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-1rem;padding-inline:1rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{
  position:sticky;top:0;z-index:5;text-align:start;padding:.55rem .6rem;
  background:var(--card-2);color:var(--ink-3);font-size:.7rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
td{padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
@media(hover:hover){tbody tr:hover td{background:var(--card-2)}}
tbody tr:last-child td{border-bottom:none}
.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot td{background:var(--card-2)!important;font-weight:800;border-top:2px solid var(--line-2)}

/* row list (mobile-friendly alternative to tables) */
.row{display:flex;align-items:center;gap:.6rem;padding:.62rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:.72rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.empty{text-align:center;color:var(--ink-3);padding:2rem 1rem;font-size:.85rem}
.note{font-size:.74rem;color:var(--ink-3);line-height:1.65}
.row .sub{margin-top:2px;line-height:1.55}
/* blocks with several stacked info lines (loans, contributions, vendor notes):
   air between the lines instead of a wall of text */
.spaced>.note{margin-top:.45rem;line-height:1.85}
.spaced .inln{margin-block:3px}
.warnbox{background:var(--warn-dim);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);
  border-radius:var(--r);padding:.6rem .75rem;font-size:.76rem;color:var(--warn-2)}

/* gifts fast entry */
/* who | amount | method + received. The last cell is one flex row on every
   width; on a phone it drops under the name to keep the amount box wide. */
.gift-row{display:grid;grid-template-columns:minmax(70px,max-content) 170px auto 1fr;gap:.6rem;align-items:center;
  padding:.55rem 0;border-bottom:1px solid var(--line)}
.gift-row .amt input{min-height:42px;font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.gift-row .meta{display:flex;gap:.5rem;align-items:center}
.gift-row .meta select{min-width:110px;min-height:42px}
.gift-row .meta .check{width:42px;height:42px}
@media(max-width:600px){
  .gift-row{grid-template-columns:1fr 92px;grid-template-areas:"who amt" "meta meta";row-gap:.4rem}
  .gift-row .who{grid-area:who}.gift-row .amt{grid-area:amt}
  .gift-row .meta{grid-area:meta}
  .gift-row .meta select{flex:1}
}
.gift-row.done{opacity:.55}
/* payment plan: inline method / date editors on a row */
select.celltxt,input.celltxt{width:auto;min-height:30px;padding:.15rem .4rem;font-size:.78rem}
input.celltxt[type=date]{width:138px}
.row.plan{padding-block:.6rem;gap:.45rem;flex-wrap:wrap}
.row.plan .main{min-width:140px}
.row.plan .late .tag{background:var(--bad-dim);color:var(--bad-2)}
/* payment history under a vendor: long notes wrap instead of being clipped */
.grow details.acc .row .sub{white-space:normal;overflow:visible}
/* gift slots nested under their guest (one line per seat) */
.gslots{margin-top:.4rem;padding-inline-start:.5rem;border-inline-start:2px solid var(--line)}
.gslots .gift-row{padding:.35rem 0;border-bottom:1px dashed var(--line)}
.gslots .gift-row:last-child{border-bottom:none}
.gsum{font-size:.76rem;color:var(--ink-3);margin-top:.35rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:baseline}
.gsum b{font-variant-numeric:tabular-nums}
.grow[hidden]{display:none}
.gslots .gift-row .who .name{font-size:.84rem;font-weight:500;color:var(--ink-2)}
body.hall .gslots .gift-row .who .name{font-size:1rem;font-weight:600;color:var(--ink)}
.check{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);
  display:grid;place-items:center;color:var(--ink-3);flex:none;cursor:pointer;
  transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.check:active{transform:scale(.9)}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.check.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.rsvp-pair{display:flex;gap:.4rem;flex:none}

.stickybar{
  margin-top:.85rem;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:.65rem .9rem;
  display:flex;gap:1rem;flex-wrap:wrap
}
.stickybar div{font-size:.72rem;color:var(--ink-3);font-weight:600}
.stickybar b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}

details.acc{border:1px solid var(--line);border-radius:var(--r);margin-top:.5rem;background:var(--bg-elev)}
details.acc>summary{padding:.5rem .7rem;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--brand-2);list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>div{padding:0 .7rem .7rem;max-height:280px;overflow:auto}

dialog{
  /* the global margin reset also zeroes the UA's margin:auto, which is what
     centres a modal; without this it sits in the top corner on a wide screen */
  margin:auto;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  border-radius:var(--r-xl);padding:1.1rem;max-width:min(440px,92vw);width:100%;
  box-shadow:var(--shadow);max-height:90vh;overflow:auto
}
dialog::backdrop{background:rgba(10,7,14,.65);backdrop-filter:blur(5px)}
dialog h3{font-size:1rem;margin-bottom:.8rem}

.toast{
  position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:99;
  display:flex;justify-content:center;pointer-events:none
}
.toast .toast-inner{
  pointer-events:auto;display:flex;align-items:center;gap:.45rem;
  background:var(--ink);color:var(--bg);padding:.4rem .4rem .4rem 1rem;
  border-radius:999px;font-size:.8rem;font-weight:700;box-shadow:var(--shadow);
  opacity:0;transform:translateY(8px);transition:.22s var(--ease);max-width:min(420px,92vw)
}
.toast.on .toast-inner{opacity:1;transform:none}
.toast .toast-inner button{
  background:var(--brand);color:var(--on-brand);border-radius:999px;padding:.28rem .75rem;
  font-size:.76rem;font-weight:800;min-height:32px;flex:none
}
@media(min-width:860px){.toast{bottom:1.5rem}}

.wa{
  display:grid;place-items:center;width:34px;height:34px;flex:none;
  border-radius:9px;border:1px solid color-mix(in srgb,var(--good) 40%,var(--line));
  background:var(--good-dim);color:var(--good-2);text-decoration:none
}
.task-hit{cursor:pointer}
.task-hit:active{background:var(--card-2)}

body.hall .gift-row{padding:.85rem 0}
body.hall .giftamt,body.hall .gift-row select,body.hall .gift-row .check{min-height:48px}
body.hall .search input{min-height:52px}
body.hall .hallbar{
  background:linear-gradient(135deg,var(--brand-2),var(--brand));color:var(--on-brand);border-radius:var(--r-lg);
  padding:.7rem .9rem;margin-bottom:.85rem;
  display:flex;align-items:center;gap:.6rem;font-weight:800
}

/* countdown hero */
.hero{
  text-align:center;padding:1.7rem 1rem 1.4rem;margin-bottom:.85rem;
  background:linear-gradient(145deg,var(--brand-dim),transparent 58%),
             linear-gradient(320deg,color-mix(in srgb,var(--plum) 18%,transparent),transparent 52%),var(--card);
  border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;
  position:relative;
}
.hero::after{
  content:"";position:absolute;inset-inline:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brand) 55%,transparent),transparent);
}
.hero .n{
  font-size:clamp(4.2rem,24vw,7.5rem);font-weight:900;line-height:.95;
  letter-spacing:-.05em;font-variant-numeric:tabular-nums;
  background:linear-gradient(90deg,var(--brand),var(--plum),var(--brand-2),var(--brand));
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:shimmer 7s linear infinite
}
@keyframes shimmer{to{background-position:250% 0}}
.hero .l{
  font-family:"Frank Ruhl Libre",Georgia,serif;
  font-size:1.14rem;font-weight:700;margin-top:.25rem
}
.hero .l .beat{display:inline-block;animation:beat 1.5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}}
.hero .d{font-size:.8rem;color:var(--ink-3);margin-top:.25rem}
/* a countdown reads like a clock — left to right even in RTL */
.hero .units{display:flex;justify-content:center;gap:.55rem;margin:.1rem 0 .45rem;direction:ltr}
.hero .unit{
  min-width:5.4rem;padding:.55rem .65rem .45rem;
  background:color-mix(in srgb,var(--bg) 45%,transparent);
  border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.hero .unit .n{
  font-size:clamp(2.3rem,11vw,3.6rem);letter-spacing:-.04em
}
.hero .unit .k{font-size:.72rem;font-weight:700;color:var(--ink-3);margin-top:.05rem}
/* four units (days/hours/min/sec) must fit a 390px phone side by side */
@media(max-width:560px){
  .hero .units{gap:.35rem}
  .hero .unit{min-width:4.2rem;padding:.45rem .35rem}
  .hero .unit .n{font-size:clamp(1.9rem,9vw,2.6rem)}
}

.cap-hero{
  text-align:center;padding:1.35rem 1rem 1.15rem;margin-bottom:.85rem;
  background:linear-gradient(155deg,var(--brand-dim),transparent 60%),
             linear-gradient(325deg,color-mix(in srgb,var(--plum) 10%,transparent),transparent 55%),var(--card);
  border:1px solid var(--line);border-radius:var(--r-xl)
}
.cap-hero .k{font-size:.78rem;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.cap-hero > .v{
  font-size:clamp(2.4rem,10vw,3.6rem);font-weight:900;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1.05;margin:.15rem 0 .2rem;
  color:var(--c,var(--brand-2))
}
.cap-hero .s{font-size:.78rem;color:var(--ink-3)}
.cap-split{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.95rem;text-align:start}
.cap-split .box{
  background:color-mix(in srgb,var(--bg) 45%,transparent);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:.7rem .8rem
}
.cap-split .k{font-size:.7rem;color:var(--ink-3);font-weight:700;margin-bottom:.15rem}
.cap-split .v{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.ring-row{display:flex;align-items:center;gap:.85rem;margin-top:1rem;text-align:start}
.ring{flex:none}
.tl{display:flex;gap:.4rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:.15rem 0;margin-top:.85rem}
.slip-prev{
  display:block;width:100%;max-height:180px;object-fit:contain;margin-bottom:.7rem;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r)
}
#slipDlg{max-width:min(520px,94vw)}
.ocr-busy{color:var(--brand-2);font-weight:700}

.inln{width:70px;display:inline-block;min-height:28px;padding:.15rem .4rem}
</style>
</head>

    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

<main class="wrap" id="main"></main>

<nav class="botnav" id="botnav" role="tablist"></nav>

<dialog id="taskDlg">

<script src="data.js"></script>
<script>
"use strict";
/* ========================================================================== *
 *  OurMoney — wedding + capital tracker
 *  State lives in localStorage. Every write goes through Store.update() so
 *  autosave and backups can never be bypassed.
 * ========================================================================== */

// Bumped on every publish. Shown in the data dialog so a device running a
// stale cached copy can be identified instead of guessed at.
const BUILD='2026-09-10-52';

// Long data notes use " · " as a separator; on screen each part gets its own
// line so the note reads as a list instead of a dense paragraph.
const noteLines=s=>esc(s).replace(/ · /g,'<br>');
const KEY='ourmoney/v1', BACKUP_KEY='ourmoney/backups', THEME_KEY='ourmoney/theme', HALL_KEY='ourmoney/hall';
const MAX_BACKUPS=5;

/* ------------------------------------------------------------------ format */
const nf=new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const money=n=>(n==null||isNaN(n))?'—':'₪'+nf.format(Math.round(n));
const moneyS=n=>(n==null||isNaN(n))?'—':(n<0?'−₪':'₪')+nf.format(Math.abs(Math.round(n)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
const dLabel=iso=>{ if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('he-IL',{day:'numeric',month:'short'}); };
const addDays=(iso,n)=>{ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const liveGuests=()=>(Store.state.guests||[]).filter(g=>!g._deleted);
// Vendors are soft-deleted too: the per-entity merge would resurrect a row
// that is simply removed from the array, so a tombstone with a fresh _m is
// the only deletion that survives a sync.
const liveVendors=()=>(Store.state.vendors||[]).filter(v=>!v._deleted);
const emptyGift=who=>({who:who||null,amount:null,method:null,received:false,date:null,note:null});
const giftSnapSlot=x=>({who:x?.who??null,amount:x?.amount??null,method:x?.method??null,
  received:!!x?.received,date:x?.date??null,note:x?.note??null});
function parsePeople(name){
  const n=String(name||'').trim();
  if(!n) return [];
  if(/משפחה/.test(n) && n.indexOf(',')<0) return [n];
  if(n.indexOf(',')>=0)
    return n.replace(/\s+ו-|\s+ו/g,', ').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);
  const two=n.split(/\s+ו-?\s*/);
  if(two.length===2 && two[0].length>=2 && two[1].length>=2 && two[1].length<=28)
    return two.map(x=>x.trim());
  return [n];
}
function splitGuestNames(g){
  const n=(g.name||'').trim();
  const seats=Math.max(Number(g.adults)||1, 1);
  const parts=parsePeople(n);
  if(parts.length===seats) return parts;
  if(parts.length>1){
    const out=parts.slice(0,seats);
    while(out.length<seats) out.push(n+' · '+(out.length+1));
    return out;
  }
  if(seats===1) return [n];
  return Array.from({length:seats},(_,i)=>n+' · '+(i+1));
}
function giftsOf(g){
  const names=splitGuestNames(g);
  const stored=g.gifts||[];
  const n=Math.max(Number(g.adults)||1, stored.length, names.length);
  const out=[];
  for(let k=0;k<n;k++){
    const name=names[k]||((g.name||'')+' · '+(k+1));
    if(stored[k]){ out.push(Object.assign(emptyGift(name), stored[k], {who:stored[k].who||name})); continue; }
    if(k===0 && g.gift && (g.gift.amount||g.gift.method||g.gift.received)){
      out.push(Object.assign(emptyGift(name), {
        amount:g.gift.amount, method:g.gift.method, received:!!g.gift.received,
        date:g.gift.date||null, note:g.gift.note||null,
      }));
      continue;
    }
    out.push(emptyGift(name));
  }
  return out;
}
function giftTotal(g){ return giftsOf(g).reduce((a,x)=>a+(Number(x.amount)||0),0); }
function giftIn(g){ return giftsOf(g).reduce((a,x)=>a+(x.received?(Number(x.amount)||0):0),0); }
function syncGiftMirror(g){
  const list=g.gifts&&g.gifts.length?g.gifts:giftsOf(g);
  const sum=list.reduce((a,x)=>a+(Number(x.amount)||0),0);
  const filled=list.filter(x=>Number(x.amount)>0);
  const first=filled[0]||list[0]||{};
  g.gift={
    amount:sum||null, method:first.method||null,
    received:filled.length?filled.every(x=>x.received):false,
    date:first.date||null, note:first.note||null,
  };
}
function writeGift(g,k,patch){
  g.gifts=giftsOf(g).map((x,i)=>i===k?Object.assign({},x,patch):Object.assign({},x));
  syncGiftMirror(g);
}
function waPhone(p){
  const d=String(p||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('972')) return d;
  if(d.startsWith('0')) return '972'+d.slice(1);
  if(d.length===9) return '972'+d;
  return d;
}
function waHref(phone,text){
  const n=waPhone(phone); if(!n) return '';
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(text);
}
function rsvpText(g){
  const n=NAMES(), m=Store.state.meta||{};
  const who=(g.name||'').split(/\s+/)[0]||'';
  const when=m.weddingDate?dmy(m.weddingDate):'';
  return `היי ${who} 💛\nמזמינים אתכם לחתונה של ${n.groom} ו${n.bride}`+
    (when?` ב־${when}`:'')+`.\nאפשר לאשר הגעה?\n`+
    `${g.adults||0} מקומות אצלנו ברשימה`+(g.children?` + ${g.children} ילדים`:'')+'.';
}

/* ------------------------------------------------------------------- store */
const Store={
  state:null, _t:null,

  boot(){
    let raw=null;
    try{ raw=localStorage.getItem(KEY); }catch(e){}
    if(raw){
      try{ this.state=JSON.parse(raw); }
      catch(e){ console.error('corrupt state, falling back to seed',e); }
    }
    if(!this.state){
      // No saved state and no data.js — the hosted build always starts here.
      // Not an error: show the welcome screen and let them import a backup.
      if(!window.SEED) return false;
      this.state=structuredClone(window.SEED);
      this.state.meta.seededAt=new Date().toISOString();
    }
    this.migrate();
    return true;
  },

  // Fields the app owns but older seeds/exports may not carry.
  migrate(){
    const s=this.state;
    s.meta=s.meta||{}; s.meta.schemaVersion=s.meta.schemaVersion||1;
    (s.guests||[]).forEach(g=>{
      g.gift=g.gift||{amount:null,method:null,received:false,date:null,note:null};
      if(g.gift.amount===undefined) g.gift.amount=null;
    });
    (s.vendors||[]).forEach(v=>{
      v.payments=v.payments||[]; v.coveredAmount=v.coveredAmount||0;
      // A device that kept Supabase-era state re-uploaded the imported advances
      // with different ids, doubling every one. The import created exactly one
      // advance per vendor, so an exact twin of an imported payment is the bug.
      const seen=new Set();
      v.payments=v.payments.filter(p=>{
        if(!p.note||!p.note.includes('יובא מהאקסל')) return true;
        const k=[p.date,p.amount,p.method,p.note].join('|');
        if(seen.has(k)) return false;
        seen.add(k); return true;
      });
    });
    (s.vendors||[]).forEach(v=>{
      // Post-dated checks used to live in v.checks; they are simply payments
      // that have not happened yet. Same id on every device keeps the merge calm.
      if(v.checks&&v.checks.length){
        v.checks.forEach(c=>{
          if(v.payments.some(p=>p.id===c.id)) return;
          v.payments.push({id:c.id,amount:c.amount,method:'check',date:c.dueDate||null,
            note:c.name||null,payee:c.payee||null,planned:true,deposit:!!c.deposit});
        });
      }
      delete v.checks;
      if(v.payMethod===undefined) v.payMethod=null;
      if(v.payDue===undefined) v.payDue=null;
    });
    (s.tasks||[]).forEach(t=>{ if(!t.status) t.status='open'; });
    if(s.capital){
      if(s.capital.prime==null) s.capital.prime=5.0;
      if(s.capital.cpi==null)   s.capital.cpi=2.5;
      ['roei','jordan'].forEach(k=>{
        const d=s.capital[k]; if(!d) return;
        d.income=d.income||{gross:null,net:null};
        d.fixedExpenses=d.fixedExpenses||[];
        d.fixedIncomes=d.fixedIncomes||[];
      });
      s.capital.slips=s.capital.slips||[];
    }
  },

  update(fn){
    const r=fn(this.state);
    this.saveSoon();
    if(typeof Sync!=='undefined') Sync.nudge();
    render();
    return r;
  },

  saveSoon(){ clearTimeout(this._t); this._t=setTimeout(()=>this.saveNow(),400); },

  saveNow(){
    try{ localStorage.setItem(KEY,JSON.stringify(this.state)); }
    catch(e){
      // Quota is the realistic failure here: drop backups before losing live data.
      try{ localStorage.removeItem(BACKUP_KEY); localStorage.setItem(KEY,JSON.stringify(this.state)); toast('שים לב: הגיבויים נמחקו מחוסר מקום'); }
      catch(e2){ toast('⚠ שמירה נכשלה — ייצא גיבוי עכשיו!'); }
    }
  },

  backup(reason){
    try{
      const list=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');
      list.unshift({ts:new Date().toISOString(),reason,json:JSON.stringify(this.state)});
      localStorage.setItem(BACKUP_KEY,JSON.stringify(list.slice(0,MAX_BACKUPS)));
    }catch(e){ /* quota — backups are best-effort, live data comes first */ }
  },

  backups(){ try{ return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]'); }catch(e){ return []; } },

  exportFile(){
    const blob=new Blob([JSON.stringify(this.state,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`ourmoney-${todayISO()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('הגיבוי ירד');
  },

  importObj(obj){
    if(!obj||!obj.meta||!obj.guests) throw new Error('קובץ לא תקין');
    if(obj.meta.schemaVersion!==1) throw new Error('גרסת סכמה לא נתמכת: '+obj.meta.schemaVersion);
    this.backup('לפני ייבוא');
    this.state=obj; this.migrate(); this.saveNow(); render();
    toast('הנתונים יובאו');
  },
};

/* ------------------------------------------------------- safe path setter  */
const ROOTS=new Set(['guests','vendors','income','forecast','tasks','quotes','contacts',
                     'events','children','brideExpenses','capital','venue','meta']);
function setPath(path,val){
  const parts=String(path).split('.');
  if(!ROOTS.has(parts[0])) throw new Error('bad path root: '+parts[0]);
  let o=Store.state;
  for(let i=0;i<parts.length-1;i++){
    const k=parts[i];
    o=Array.isArray(o)?o[Number(k)]:o[k];
    if(o==null) throw new Error('bad path: '+path);
  }
  const last=parts[parts.length-1];
  if(Array.isArray(o)) o[Number(last)]=val; else o[last]=val;
}

/* ------------------------------------------------------------------- calc  */
const calc={
  // Money that actually left: not planned, not a deposit held as security.
  paidOf:v=>(v.payments||[]).reduce((s,p)=>s+((p.planned||p.deposit)?0:(Number(p.amount)||0)),0),
  plannedOf:v=>(v.payments||[]).reduce((s,p)=>s+((p.planned&&!p.deposit)?(Number(p.amount)||0):0),0),
  remainOf(v){ return (Number(v.total)||0)-this.paidOf(v)-(Number(v.coveredAmount)||0); },
  // Remainder with no scheduled payment yet — needs a method and a date.
  unscheduledOf(v){ return Math.max(0,this.remainOf(v)-this.plannedOf(v)); },

  seatCost(g){
    const V=Store.state.venue||{};
    return (g.adults||0)*(Number(V.pricePerPlate)||0)+(g.children||0)*(Number(V.childPlate)||0);
  },
  giftNet(g){ return giftTotal(g)-this.seatCost(g); },

  totals(){
    const s=Store.state, guests=liveGuests();
    const vendors=liveVendors();
    const cost=vendors.reduce((a,v)=>a+(Number(v.total)||0),0);
    const paid=vendors.reduce((a,v)=>a+this.paidOf(v),0);
    const covered=vendors.reduce((a,v)=>a+(Number(v.coveredAmount)||0),0);
    const remaining=cost-paid-covered;
    const income=s.income.reduce((a,i)=>a+(Number(i.received)||0),0);
    const expected=s.income.reduce((a,i)=>a+(Number(i.expected)||0),0);
    const gifts=guests.reduce((a,g)=>a+giftTotal(g),0);
    const giftsIn=guests.reduce((a,g)=>a+giftIn(g),0);
    return {cost,paid,covered,remaining,income,expected,gifts,giftsIn,
            balance:income+gifts-remaining-paid,
            cash:income+giftsIn-paid};
  },

  headcount(){
    const g=liveGuests(), seats=x=>(x.adults||0);
    return {
      rows:g.length,
      invited:g.reduce((a,x)=>a+seats(x),0),
      kids:g.reduce((a,x)=>a+(x.children||0),0),
      confirmed:g.filter(x=>x.rsvp==='confirmed').reduce((a,x)=>a+seats(x),0),
      declined:g.filter(x=>x.rsvp==='declined').reduce((a,x)=>a+seats(x),0),
      pending:g.filter(x=>x.rsvp==='pending').reduce((a,x)=>a+seats(x),0),
      sent:g.filter(x=>x.invitationSent).length,
    };
  },

  daysLeft(){
    const w=new Date(Store.state.meta.weddingDate+'T00:00:00');
    const t=new Date(); t.setHours(0,0,0,0);
    return Math.round((w-t)/864e5);
  },
};

const CEREMONY_HM='19:30';
function weddingAt(){
  const iso=Store.state&&Store.state.meta&&Store.state.meta.weddingDate;
  if(!iso) return null;
  const w=new Date(`${iso}T${CEREMONY_HM}:00`);
  return isNaN(w)?null:w;
}
function untilWedding(){
  const w=weddingAt();
  if(!w) return null;
  const ms=w.getTime()-Date.now();
  if(ms<=0) return {past:true,days:0,hours:0,minutes:0,seconds:0};
  return {
    past:false,
    days:Math.floor(ms/864e5),
    hours:Math.floor(ms%864e5/36e5),
    minutes:Math.floor(ms%36e5/6e4),
    seconds:Math.floor(ms%6e4/1e3),
  };
}
function cdUnit(n, one, many){
  return `<div class="unit"><div class="n" data-cdn>${n}</div><div class="k">${n===1?one:many}</div></div>`;
}
function dashCountdownHTML(){
  const u=untilWedding();
  if(!u||u.past) return '';
  return `<div class="units" id="dashCd">
    ${cdUnit(u.days,'יום','ימים')}
    ${cdUnit(u.hours,'שעה','שעות')}
    ${cdUnit(u.minutes,'דקה','דקות')}
    ${cdUnit(u.seconds,'שנייה','שניות')}
  </div>
  <div class="l">לחתונה · מתחילה ב־${CEREMONY_HM} <span class="beat">💍</span></div>`;
}
let cdTimer=null;
let refocus=null; // CSS selector to focus after the next render
function stopCountdown(){ clearInterval(cdTimer); cdTimer=null; }
function paintCountdown(){
  const root=document.getElementById('dashCd');
  const u=untilWedding();
  if(!root||!u||u.past){
    stopCountdown();
    if(root&&u&&u.past) render();
    return;
  }
  const nums=root.querySelectorAll('[data-cdn]');
  const vals=[u.days,u.hours,u.minutes,u.seconds];
  const labels=['יום|ימים','שעה|שעות','דקה|דקות','שנייה|שניות'];
  nums.forEach((el,i)=>{
    if(el.textContent!==String(vals[i])) el.textContent=vals[i];
    const [one,many]=labels[i].split('|');
    const k=el.parentElement.querySelector('.k');
    const lab=vals[i]===1?one:many;
    if(k&&k.textContent!==lab) k.textContent=lab;
  });
  const pill=document.getElementById('countdown');
  if(pill){
    const html=u.days>0
      ? `<b>${u.days}</b> ימים<span class="cd-x"> · ${u.hours} שע׳</span>`
      : `<b>${u.hours}</b> שע׳`;
    if(pill.innerHTML!==html) pill.innerHTML=html;
  }
}

/* ------------------------------------------------------------------ toast  */
let toastT, undoFn=null;
function toast(msg, act){
  const el=document.getElementById('toast');
  el.querySelector('span').textContent=msg;
  const btn=document.getElementById('toastAct');
  undoFn=act&&act.run||null;
  if(btn){
    btn.hidden=!undoFn;
    btn.textContent=(act&&act.label)||'ביטול';
  }
  el.classList.add('on'); clearTimeout(toastT);
  toastT=setTimeout(()=>{ el.classList.remove('on'); undoFn=null; }, act?8000:2200);
}
function toastUndo(msg, fn){ toast(msg,{label:'ביטול',run:fn}); }

const METHOD_HE={transfer:'העברה',cash:'מזומן',check:'צ׳ק',credit:'אשראי',bit:'ביט'};
// Free-text methods from the import («העברה בנקאית- …») fold into the same buckets.
const methodKey=m=>{ const x=String(m||'');
  return /צ.?ק|check/i.test(x)?'check':/העבר|transfer/i.test(x)?'transfer':/מזומ|cash/i.test(x)?'cash'
       :/אשראי|credit/i.test(x)?'credit':/ביט|bit/i.test(x)?'bit':''; };
// \b does not know Hebrew letters, so test the separator explicitly.
const isParent=g=>/^(אבא|אמא)(\s|$)/.test(String(g.name||'').trim());
function moneySummary(){
  const by={};
  liveVendors().forEach(v=>(v.payments||[]).forEach(p=>{
    if(p.planned||p.deposit) return;
    const k=methodKey(p.method)||'other'; by[k]=(by[k]||0)+(Number(p.amount)||0);
  }));
  const byMethod=Object.entries(by).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`${k==='other'?'מקדמות בלי אמצעי רשום':METHOD_HE[k]} ${money(v)}`).join(' · ');
  const parents=liveGuests().filter(isParent).reduce((a,g)=>a+giftIn(g),0);
  const planned=liveVendors().reduce((a,v)=>a+calc.plannedOf(v),0);
  const unplanned=liveVendors().reduce((a,v)=>a+calc.unscheduledOf(v),0);
  return {byMethod,parents,planned,unplanned};
}
const methodHe=m=>m?(METHOD_HE[m]||m):'';
/* Every shekel still owed, as a dated line: explicit planned payments (checks
   handed over, transfers agreed) plus, per vendor, whatever remainder has no
   line yet — that one carries the vendor's default method and due date. */
function paymentPlan(){
  const lines=[];
  Store.state.vendors.forEach((v,vi)=>{
    if(v._deleted) return;
    (v.payments||[]).forEach((p,pi)=>{
      if(p.planned) lines.push({v,vi,p,pi,kind:'planned',amount:Number(p.amount)||0,
        date:p.date||null,method:p.method||null,deposit:!!p.deposit});
    });
    const rest=calc.unscheduledOf(v);
    if(rest>0) lines.push({v,vi,kind:'rest',amount:rest,date:v.payDue||null,method:v.payMethod||null,deposit:false});
  });
  return lines.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
}

function filteredGuests(q,side,group,rsvp){

/* Gift figures for the whole list. The parents' contributions are kept apart:
   with 173,000 from two rows they would swamp any per-guest average. */
function giftStats(){
  const G=liveGuests(), V=Store.state.venue||{}, plate=Number(V.pricePerPlate)||0;
  const guests=G.filter(g=>!isParent(g));
  const gave=guests.filter(g=>giftTotal(g)>0);
  const total=gave.reduce((a,g)=>a+giftTotal(g),0);
  const envelopes=gave.reduce((a,g)=>a+giftsOf(g).filter(x=>Number(x.amount)>0).length,0);
  // Someone who did not come but sent a gift costs no plate (their row shows
  // pure net) and is listed apart -- yet they count in the per-guest average.
  const absent=gave.filter(g=>g.rsvp==='declined');
  const absentTotal=absent.reduce((a,g)=>a+giftTotal(g),0);
  const gaveSeats=gave.reduce((a,g)=>a+(g.adults||0),0);
  const confirmed=guests.filter(g=>g.rsvp==='confirmed');
  const confirmedSeats=confirmed.reduce((a,g)=>a+(g.adults||0),0);
  // Coverage is counted in seats, not envelopes: one envelope from a row of
  // three covers three guests.
  const coveredRows=confirmed.filter(g=>giftTotal(g)>0);
  const coveredSeats=coveredRows.reduce((a,g)=>a+(g.adults||0),0);
  const notYetRows=confirmed.filter(g=>!(giftTotal(g)>0));
  const notYet=notYetRows.length;
  const notYetSeats=notYetRows.reduce((a,g)=>a+(g.adults||0),0);
  const parents=G.filter(isParent).reduce((a,g)=>a+giftTotal(g),0);
  return {total,parents,envelopes,rows:gave.length,gaveSeats,confirmedSeats,notYet,plate,
    absent:absent.length,absentTotal,absentRows:absent,coveredSeats,coveredRows:coveredRows.length,notYetSeats,
    perSeat:gaveSeats?total/gaveSeats:0, perConfirmed:confirmedSeats?total/confirmedSeats:0};
}

      <div class="s">${esc(`${gs.coveredRows} משפחות הביאו · נשארו ${nf.format(gs.notYetSeats)} אורחים ב־${gs.notYet} משפחות · לחיצה מסננת`)}</div>

/* =================================================================== TASKS  */
function vTasks(){
  const all=Store.state.tasks||[];
  const today=todayISO();
  let list=all;
  if(ui.taskFilter==='open') list=all.filter(t=>t.status!=='done');
  if(ui.taskFilter==='done') list=all.filter(t=>t.status==='done');
  if(ui.taskFilter==='soon') list=all.filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate<=addDays(today,14));
  if(ui.taskFilter==='late') list=all.filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate<today);

  const byTopic={};
  list.forEach(t=>{ (byTopic[t.topic||'כללי'] ||= []).push(t); });
  Object.values(byTopic).forEach(a=>a.sort((x,y)=>(x.dueDate||'9999').localeCompare(y.dueDate||'9999')));

  const open=all.filter(t=>t.status!=='done').length;
  const overdue=all.filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate<today).length;

  return `
  <div class="grid g4" style="margin-bottom:.85rem">
    ${stat('סה״כ משימות',all.length,'','var(--ink)')}
    ${stat('פתוחות',open,'','var(--warn-2)')}
    ${stat('הושלמו',all.length-open,'','var(--good-2)')}
    ${stat('באיחור',overdue,'עבר תאריך היעד','var(--bad-2)')}
  </div>
  <div class="card">
    <div class="chips">
      <button class="chip" data-tf="open" aria-pressed="${ui.taskFilter==='open'}">פתוחות</button>
      <button class="chip" data-tf="soon" aria-pressed="${ui.taskFilter==='soon'}">14 הימים הקרובים</button>
      <button class="chip" data-tf="late" aria-pressed="${ui.taskFilter==='late'}">באיחור</button>
      <button class="chip" data-tf="done" aria-pressed="${ui.taskFilter==='done'}">הושלמו</button>
      <button class="chip" data-tf="all"  aria-pressed="${ui.taskFilter==='all'}">הכל</button>
      <button class="chip" data-act="task-new"
        style="background:var(--brand);border-color:var(--brand);color:var(--on-brand)">+ משימה חדשה</button>
    </div>
    <p class="note" style="margin-top:.6rem">
      תאריכי היעד מחושבים מתאריך החתונה (${Store.state.meta.weddingDate}) פחות «כמה ימים לפני האירוע»,
      כי התאריכים המקוריים בגיליון «תכנון» היו של תבנית משנת 2018.
    </p>
  </div>
  ${Object.keys(byTopic).length?Object.entries(byTopic).map(([topic,items])=>`
    <div class="card">
      <div class="card-h"><span class="dot" style="background:var(--brand)"></span><h2>${esc(topic)}</h2>
        <span class="sp note">${items.length}</span></div>
      ${items.map(t=>{
        const idx=all.indexOf(t);
        const late=t.status!=='done'&&t.dueDate&&t.dueDate<today;
        return `<div class="row">
          <button class="check" data-td="${idx}" aria-pressed="${t.status==='done'}">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></button>
          <div class="main">
            <div class="name" style="${t.status==='done'?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(t.title)}</div>
            <div class="sub">${t.owner?esc(t.owner)+' · ':''}${esc(t.source)}${t.notes?' · '+esc(t.notes):''}</div>
          </div>
          ${t.dueDate?`<span class="tag ${late?'t-bad':'t-mute'}">${dLabel(t.dueDate)}</span>`:''}
        </div>`;}).join('')}
    </div>`).join(''):'<div class="card"><div class="empty">אין משימות בקטגוריה הזו</div></div>'}`;
}

/* ================================================================= CAPITAL  *
 * Loan math ported verbatim from calculator.html. These figures are checked
 * against the real bank documents (see the doc{} blocks in the seed), so the
 * formulas must not drift -- vCapital reproduces calculator.html exactly.
 */
const spz=(P,r,m)=>{ if(r<=0||m<=0) return {mo:P>0?Math.round(P/Math.max(m,1)):0,ti:0,tp:P};
  const rm=r/12,f=Math.pow(1+rm,m),mo=P*rm*f/(f-1);
  return {mo:Math.round(mo),ti:Math.round(mo*m-P),tp:Math.round(mo*m)}; };
const grc=(P,r,gM,sM)=>{ const g=Math.round(P*r/12),gi=g*gM,s=spz(P,r,sM);

// How many monthly payments of a loan starting at l.start (first payment date)
// have already happened. Drives the live remaining-balance display.
function monthsPaid(l){
  if(!l.start) return 0;
  const s=new Date(l.start+'T00:00:00'), t=new Date(todayISO()+'T00:00:00');
  if(t<s) return 0;
  let n=(t.getFullYear()-s.getFullYear())*12+(t.getMonth()-s.getMonth());
  if(t.getDate()>=s.getDate()) n+=1;
  return Math.min(Math.max(n,0),l.months);
}

// Monthly fixed outgoings: active loan payments plus standing expenses.

function personOutgoings(key){
  const d=Store.state.capital[key], p=ui.prime;

    if(l.fromSalary) return;
    if(l.start&&monthsPaid(l)>=l.months) return;
    loansMo+=l.doc?l.doc.monthly:spz(l.amount,lr(l,p),l.months).mo;
  });
  const fixed=(d.fixedExpenses||[]).reduce((a,f)=>a+(Number(f.amount)||0),0);
  return {loansMo,fixed,total:loansMo+fixed};
}

function parseIlNum(s){

/* pdf.js often returns Hebrew in visual order (mirrored). Flipping the line
   restores the words but mirrors every number, so digit runs get flipped back. */
function unvisual(line){
  const rev=[...String(line)].reverse().join('');
  return rev.replace(/[0-9][0-9.,:%\/-]*[0-9]|[0-9]/g,m=>[...m].reverse().join(''));
}
const HE_HINTS=['ברוטו','נטו','פנסיה','השתלמות','פיצוי','מס הכנסה','ביטוח לאומי','בריאות','זיכוי','חופשה','מחלה','שכר','תלוש'];
function heScore(lines){
  const t=lines.join('\n');
  return HE_HINTS.reduce((a,k)=>a+(t.includes(k)?t.split(k).length-1:0),0);
}
/* Number tokens on a line, with their positions. Skips percentages (rate
   columns) and date components. */
function lineNums(line){
  const out=[];
  const re=/(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?)/g;
  let m;
  while((m=re.exec(line))){
    const before=line[m.index-1]||'', after=line[m.index+m[0].length]||'';
    if(after==='%'||before==='%') continue;
    if(before==='/'||after==='/') continue;                  // date component
    if(before==='.'&&/\d/.test(line[m.index-2]||'')) continue; // tail of a decimal
    const v=parseIlNum(m[0]);
    if(v==null) continue;
    out.push({v,at:m.index,end:m.index+m[0].length});
  }
  return out;
}
function parseTlush(input){
  const lines=(Array.isArray(input)?input:String(input||'').split(/\n+/))
    .map(l=>String(l).replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim())
    .filter(Boolean);
  const n=lines.join('\n');
  const out={};

  // Nearest plausible number to the keyword on the same line. In an RTL table
  // flattened left-to-right the amount usually sits BEFORE the label, so both
  // sides are considered and the closer one wins.
  const fromLines=spec=>{
    for(const k of spec.keys){
      for(const line of lines){
        const i=line.indexOf(k);
        if(i<0) continue;
        const cands=lineNums(line).filter(x=>
          x.v>=(spec.min??0)&&x.v<=(spec.max??2000000));
        if(!cands.length) continue;
        // Slight bias toward the number after the label, so on a line that
        // carries two label+value pairs each label claims its own value.
        cands.sort((a,b)=>{
          const da=a.at>=i+k.length?a.at-(i+k.length):i-a.end+3;
          const db=b.at>=i+k.length?b.at-(i+k.length):i-b.end+3;
          return da-db;
        });
        return cands[0].v;
      }
    }
    return null;
  };
  // Old windowed fallback over the whole text, for OCR soup without line structure.
  const numAfter=(keys,win)=>{
    for(const k of keys){
      const i=n.indexOf(k);
      if(i<0) continue;
      const slice=n.slice(i+k.length, i+k.length+(win||70));
      const m=slice.match(/(\d{1,3}(?:[.,]\d{3})+|\d+)(?:[.,]\d{1,2})?/);
      if(!m) continue;
      const v=parseIlNum(m[1]);
      if(v!=null) return v;
    }
    return null;
  };

  let ym=null;
  const iso=n.match(/(\d{4})[-\/.](\d{1,2})/);
  if(iso&&+iso[2]>=1&&+iso[2]<=12) ym=`${iso[1]}-${String(iso[2]).padStart(2,'0')}`;
  const he=n.match(/לחודש\s+(\S+)\s+(\d{4})/);
  if(he&&HE_MON[he[1]]) ym=`${he[2]}-${String(HE_MON[he[1]]).padStart(2,'0')}`;
  const dmy=n.match(/(\d{1,2})[\/.](\d{4})/);
  if(!ym&&dmy&&+dmy[1]>=1&&+dmy[1]<=12) ym=`${dmy[2]}-${String(dmy[1]).padStart(2,'0')}`;
  if(ym) out.period=ym;

  SLIP_SPEC.forEach(spec=>{
    let v=fromLines(spec);
    if(v==null){
      v=numAfter(spec.keys);
      if(v!=null&&(v<(spec.min??0)||v>(spec.max??2000000))) v=null;
    }
    if(v!=null) out[spec.k]=v;
  });

  // A slip where "net" swallowed the gross line (or vice versa) is worse than
  // an empty box the user fills by eye.
  if(out.gross!=null&&out.net!=null&&out.net>out.gross) delete out.net;
  return out;
}
function loadScript(src){

    if([...document.scripts].some(s=>s.src===src||s.getAttribute('src')===src)) return res();
    const el=document.createElement('script');
    el.src=src; el.onload=res; el.onerror=()=>rej(new Error('טעינת ספרייה נכשלה'));
    document.head.appendChild(el);

async function ensurePdfJs(){

  window.pdfjsLib.GlobalWorkerOptions.workerSrc=

async function ensureTesseract(){
  if(window.Tesseract) return;

}
/* Text out of every page, rebuilt into visual lines: pdf.js hands back loose
   items; grouping them by their y coordinate and sorting by x recovers the
   table rows, which is what the parser feeds on. */
async function pdfExtract(file){
  await ensurePdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let lines=[], canvas=null;
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const items=tc.items
      .filter(it=>it.str&&it.str.trim())
      .map(it=>({x:it.transform[4],y:it.transform[5],s:it.str}))
      .sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null,curY=null;
    for(const it of items){
      if(cur&&Math.abs(it.y-curY)<=4){ cur.push(it); }
      else{
        if(cur) lines.push(cur.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' '));
        cur=[it]; curY=it.y;
      }
    }
    if(cur) lines.push(cur.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' '));
    if(p===1){
      const viewport=page.getViewport({scale:2});
      canvas=document.createElement('canvas');
      canvas.width=viewport.width; canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
    }
  }
  lines=lines.map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  // Some producers store Hebrew mirrored; keep whichever direction actually
  // contains the payslip vocabulary.
  const flipped=lines.map(unvisual);
  if(heScore(flipped)>heScore(lines)) lines=flipped;
  return {lines, text:lines.join('\n'), canvas};
}
async function ocrSource(src, status){
  await ensureTesseract();
  status('קורא את התלוש… זה יכול לקחת רגע');
  const {data}=await window.Tesseract.recognize(src,'heb+eng');
  return data&&data.text||'';
}
async function ingestSlipFile(file){
  const status=msg=>{
    const el=$('#slipStatus'); if(!el) return;
    el.textContent=msg; el.classList.toggle('ocr-busy',/קורא|טוען/.test(msg));
  };
  clearSlipPreview();
  try{
    status('טוען…');
    let src=null, preview=null;
    if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
      const {lines,text,canvas}=await pdfExtract(file);
      preview=canvas.toDataURL('image/jpeg',0.7);
      const img=$('#slipPrev'); img.src=preview; img.hidden=false;
      // A scanned PDF has an image and (almost) no text layer — OCR it instead.

/* -------------------------------------------------------- pension forecast  */
function slipDeposits(key){
  const avg=avgLast(key,3);
  if(avg){
    const pen=avg.pensionEmp+avg.pensionEr+avg.severance, kh=avg.khEmp+avg.khEr;
    if(pen+kh>0) return {pen,kh,src:`ממוצע ${avg.n===1?'תלוש אחד':avg.n+' תלושים'}`};
  }
  const g=Number(Store.state.capital[key].income&&Store.state.capital[key].income.gross)||0;
  const t=theoreticalPension(g);
  if(t) return {pen:t.pt,kh:t.kt,src:'מחושב מהברוטו — אין תלושים'};
  return {pen:0,kh:0,src:'אין נתוני הפקדות'};
}
/* Monthly compounding on today's balances plus the monthly deposits from the
   slips; deposits grow once a year with the salary. Nominal terms, no fees. */
function pensionSim(key,years,retPct,growPct){
  const a=Store.state.capital[key].assets||{};
  let P=Number(a.pension)||0, K=Number(a.kh)||0,
      G=(Number(a.gemel_analyst)||0)+(Number(a.gemel_altshuler)||0);
  const dep=slipDeposits(key);
  let dPen=dep.pen,dKh=dep.kh;
  const r=retPct/100/12;
  const series=[P+K+G];
  for(let m=1;m<=years*12;m++){
    P=P*(1+r)+dPen; K=K*(1+r)+dKh; G=G*(1+r);
    if(m%12===0){
      series.push(P+K+G);
      dPen*=1+growPct/100; dKh*=1+growPct/100;
    }
  }
  return {series,pension:P,kh:K,gemel:G,total:P+K+G,dep};
}

/* Pension: actuals from the latest payslip, with the statutory maximum as a
   comparison. Forecast = average of last 3 slips × months left this year. */
function socialCard(){
  const n=NAMES();
  const left=monthsLeftInYear();
  const person=(key,name)=>{
    const g=Number(Store.state.capital[key].income&&Store.state.capital[key].income.gross)||0;
    const slip=latestSlip(key);
    const theo=theoreticalPension(g);
    const avg=avgLast(key,3);
    if(!slip&&!theo) return '';
    const pe=slip?Number(slip.pensionEmp)||0:theo.pe;
    const pr=slip?Number(slip.pensionEr)||0:theo.pr;
    const ps=slip?Number(slip.severance)||0:theo.ps;
    const ke=slip?Number(slip.khEmp)||0:theo.ke;
    const kr=slip?Number(slip.khEr)||0:theo.kr;
    const pt=pe+pr+ps, kt=ke+kr;
    const insured=slip&&slip.insured;
    const src=slip?`תלוש ${periodLabel(slip.period)}`:'מחושב מהברוטו — אין תלוש עדיין';
    const over=g>KH_CEIL;
    const fPen=avg?((avg.pensionEmp+avg.pensionEr+avg.severance)*left):pt*left;
    const fKh=avg?((avg.khEmp+avg.khEr)*left):kt*left;
    return `<div class="spaced" style="padding:.8rem 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap">
        <b>${esc(name)}</b>
        <span class="note">${src}${g?` · ברוטו ${money(g)}`:''}${insured?` · מבוטח ${money(insured)}`:''}</span>
        <span class="sp" style="margin-inline-start:auto;font-weight:800;color:var(--good-2)">${money(pt+kt)}/חד׳</span>
      </div>
      ${insured&&g&&insured<g*0.95?`<div class="warnbox" style="margin-top:.45rem">השכר המבוטח נמוך מהברוטו — הפנסיה לא יורדת על כל המשכורת.</div>`:''}
      <div class="note"><b>פנסיה — ${money(pt)}/חד׳</b><br>
        עובד ${money(pe)}${theo?` · תיאוריה ${money(theo.pe)}`:''}<br>
        מעביד ${money(pr)}${theo?` · תיאוריה ${money(theo.pr)}`:''}<br>
        פיצויים ${money(ps)}${theo?` · תיאוריה ${money(theo.ps)}`:''}</div>
      <div class="note"><b>קרן השתלמות — ${money(kt)}/חד׳</b><br>
        עובד ${money(ke)} · מעביד ${money(kr)}
        ${over?`<br>הברוטו מעל תקרת ההטבה (~${money(KH_CEIL)}) — רווחים מעל התקרה חייבים במס.`:''}</div>
      <div class="note">עד סוף השנה (${left} חד׳)${avg?` לפי ממוצע ${avg.n} תלושים`:''}:
        פנסיה ${money(fPen)} · קה״ש ${money(fKh)} · <b>סה״כ ${money(fPen+fKh)}</b></div>
    </div>`;
  };
  const body=person('roei',n.groom)+person('jordan',n.bride);
  if(!body) return '';
  return `<div class="card">
    <div class="card-h"><span class="dot" style="background:var(--good)"></span>
      <h2>הפרשות לפנסיה וקרן השתלמות</h2></div>
    ${body}
    <p class="note" style="margin-top:.5rem">המספרים מגיעים מהתלוש האחרון. התיאוריה היא
    7% עובד + 7.5% מעביד + 8.33% פיצויים, וקה״ש 2.5% + 7.5% מהברוטו.
    יתרות הקופות עדיין ידניות — התלוש אומר כמה הופקד, לא כמה יש בקופה.</p>
  </div>`;
}

function capCalc(){
  const {amount:a,months:m,grace:gM,ty,rt,spread:s}=ui.calc;
  const p=ui.prime,c=ui.cpi;
  let r,label;
  if(rt==='pp'){ r=p+s; label=`P+${s.toFixed(1)} = ${r.toFixed(2)}%`; }
  else if(rt==='pm'){ r=p-s; label=`P−${s.toFixed(1)} = ${r.toFixed(2)}%`; }
  else if(rt==='fx'){ r=s; label=`${r.toFixed(2)}% קבועה`; }
  else { r=s+c; label=`${s.toFixed(1)}% + מדד = ${r.toFixed(2)}%`; }
  const rate=r/100;

  const bar=(prin,int)=>{ const t=prin+int; if(t<=0) return '';
    return `<div class="bar" style="margin-top:.7rem;height:22px">
      <i style="width:${prin/t*100}%;background:var(--brand)"></i>
      <i style="width:${int/t*100}%;background:var(--bad)"></i></div>
      <div class="chips" style="margin-top:.4rem">
        <span class="chip sm">קרן ${Math.round(prin/t*100)}%</span>

  if(ty==='sp'){

    </div>`+bar(a,x.ti)+amortHTML(a,rate,m,'הלוואה מחושבת');

  if(ty==='gr'){
    const x=grc(a,rate,gM,Math.max(1,m-gM));
    return `<div class="grid g4" style="margin-top:.85rem">
      ${statMini('ריבית',label)}${statMini('בתקופת גרייס',money(x.gMo))}

    </div>`+bar(a,x.ti);
  }
  const x=bln(a,rate,m);
  return `<div class="grid g4" style="margin-top:.85rem">
    ${statMini('ריבית',label)}${statMini('חודשי (ריבית בלבד)',money(x.mo))}

    ${statMini('סה״כ ריבית',money(x.ti),'var(--bad-2)')}
  </div>`+bar(a,x.ti);
}
const statMini=(k,v,c)=>`<div class="stat" style="--c:${c||'var(--brand)'}">
  <div class="k">${k}</div><div class="v" style="font-size:1.05rem">${v}</div></div>`;

const GH_TOKEN='ourmoney/gh-token', GH_SHA='ourmoney/gh-sha';
const POLL_MS=10000;

/* ==================================================================== SYNC  *
 * State is one JSON file in a private GitHub repo, read and written through
 * the Contents API. Chosen over a database for one blunt reason: this is the
 * only backend both the app AND Claude can reach directly, so a problem can be
 * inspected and repaired at the source instead of relayed through the user.
 *
 * The whole document travels at once, so merging is done per entity on a
 * modified stamp: two phones editing different guests never collide, and the
 * later edit wins on the same one.
 * ========================================================================== */
const b64enc=s=>{ const b=new TextEncoder().encode(s); let x='';
  b.forEach(c=>{ x+=String.fromCharCode(c); }); return btoa(x); };
const b64dec=s=>new TextDecoder().decode(
  Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0)));

const Sync={
  repo:'RoiSadeh5/ourmoney-data', path:'state.json',
  token:null, sha:null, status:'off', lastError:null, busy:false, timer:null,
  snap:{guests:{},vendors:{},tasks:{}},

  load(){
    try{ this.token=localStorage.getItem(GH_TOKEN)||null;
         this.sha=localStorage.getItem(GH_SHA)||null; }catch(e){}
    if(this.token) this.status='idle';
  },
  saveToken(t){ this.token=t.trim(); localStorage.setItem(GH_TOKEN,this.token); },
  forget(){ localStorage.removeItem(GH_TOKEN); localStorage.removeItem(GH_SHA);
            this.token=null; this.sha=null; this.status='off'; this.stop(); },
  get on(){ return !!this.token; },
  get who(){ return this.repo; },

  async api(path,opts={}){
    const r=await fetch(`https://api.github.com/${path}`,{
      ...opts,
      headers:{'Authorization':`Bearer ${this.token}`,
               'Accept':'application/vnd.github+json',
               'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})},
    });
    if(r.status===404) return null;
    if(!r.ok){
      let msg=''; try{ msg=(await r.json()).message||''; }catch(e){}
      throw new Error(`${r.status}: ${msg||'שגיאה'}`);
    }
    return r.json();
  },

  /* --------------------------------------------------------------- stamps */
  clean(o){ const c={...o}; delete c._m; return JSON.stringify(c); },
  seedSnapshot(){
    if(!Store.state) return;
    ['guests','vendors','tasks'].forEach(k=>{
      this.snap[k]={};
      (Store.state[k]||[]).forEach(i=>{ this.snap[k][i.id]=this.clean(i); });
    });
  },
  // Anything whose content changed since the last pass gets a fresh stamp, so
  // no mutation site has to remember to mark itself dirty.
  stampChanges(){
    if(!Store.state) return;
    const now=Date.now();
    ['guests','vendors','tasks'].forEach(k=>{
      (Store.state[k]||[]).forEach(i=>{
        const h=this.clean(i);
        if(this.snap[k][i.id]!==h){ i._m=now; this.snap[k][i.id]=h; }
      });
    });
  },

  COLD:['meta','venue','income','forecast','forecastIncome','quotes','contacts',
        'paymentChecklist','events','children','brideExpenses','capital'],

  merge(remote){
    if(!Store.state){ Store.state=remote; return 1; }
    let n=0;
    ['guests','vendors','tasks'].forEach(k=>{
      const local=Store.state[k]||(Store.state[k]=[]);
      const byId=new Map(local.map((x,i)=>[x.id,i]));
      (remote[k]||[]).forEach(r=>{
        if(byId.has(r.id)){
          const i=byId.get(r.id), l=local[i];
          if((r._m||0)>(l._m||0)){ local[i]=r; n++; }
        }else{ local.push(r); n++; }
      });
    });
    // Cold data moves as a block; the newer stamp wins.
    if((remote._coldM||0)>(Store.state._coldM||0)){
      this.COLD.forEach(k=>{ if(remote[k]!==undefined) Store.state[k]=remote[k]; });
      Store.state._coldM=remote._coldM; n++;
    }
    return n;
  },

  coldChanged(){
    // A fresh device connects with no state at all -- nothing to stamp yet.
    if(!Store.state) return false;
    const h=JSON.stringify(this.COLD.map(k=>Store.state[k]));
    if(h!==this._coldSnap){ this._coldSnap=h; return true; }
    return false;
  },

  /* ----------------------------------------------------------------- pull */
  async fetchRemote(){
    const j=await this.api(`repos/${this.repo}/contents/${this.path}`);
    if(!j) return null;
    this.sha=j.sha; localStorage.setItem(GH_SHA,j.sha);
    return JSON.parse(b64dec(j.content));
  },

  /* ----------------------------------------------------------------- push */
  async pushNow(){
    const body=JSON.stringify(Store.state);
    const payload={message:`sync ${new Date().toISOString()}`,content:b64enc(body)};
    if(this.sha) payload.sha=this.sha;
    let j;
    try{
      j=await this.api(`repos/${this.repo}/contents/${this.path}`,
        {method:'PUT',headers:{'Content-Type':'application/json'},
         body:JSON.stringify(payload)});
    }catch(e){
      // 409 means someone else wrote first: take theirs, merge, write again.
      if(/^409/.test(e.message)){
        const remote=await this.fetchRemote();
        if(remote) this.merge(remote);
        const retry={message:'sync merge',content:b64enc(JSON.stringify(Store.state)),sha:this.sha};
        j=await this.api(`repos/${this.repo}/contents/${this.path}`,
          {method:'PUT',headers:{'Content-Type':'application/json'},
           body:JSON.stringify(retry)});
      }else throw e;
    }
    if(j&&j.content){ this.sha=j.content.sha; localStorage.setItem(GH_SHA,j.content.sha); }
  },

  async run(){
    if(!this.on||this.busy) return;
    this.busy=true; this.setStatus('syncing');
    try{
      const remote=await this.fetchRemote();
      const hadLocal=!!Store.state;
      if(remote){
        this.stampChanges();
        const n=this.merge(remote);
        if(n){ Store.migrate(); Store.saveNow(); this.seedSnapshot(); render(); }
        // Bootstrapped from the server just now: seed the cold snapshot so the
        // next pass doesn't stamp _coldM over data this device never touched.
        if(!hadLocal) this.coldChanged();
      }
      if(hadLocal){
        this.stampChanges();
        if(this.coldChanged()) Store.state._coldM=Date.now();
        await this.pushNow();
      }
      this.lastError=null; this.setStatus('ok');
    }catch(e){ this.lastError=e.message; this.setStatus('error'); }
    finally{ this.busy=false; }
  },

  async uploadAll(){
    Store.state._coldM=Date.now();
    const now=Date.now();
    ['guests','vendors','tasks'].forEach(k=>
      (Store.state[k]||[]).forEach(i=>{ i._m=now; }));
    this.sha=null;
    try{ const r=await this.fetchRemote(); }catch(e){}
    await this.pushNow();
    this.seedSnapshot();
    toast('הכול הועלה');
  },

  async diagnose(){
    const remote=await this.fetchRemote();
    const cnt=s=>s?({guests:(s.guests||[]).length,vendors:(s.vendors||[]).length,
      tasks:(s.tasks||[]).length,
      payments:(s.vendors||[]).reduce((a,v)=>a+((v.payments||[]).length),0)}):null;
    return {local:cnt(Store.state),server:cnt(remote),
            serverDate:remote&&remote.meta?remote.meta.weddingDate:null};
  },

  looksPartial(){
    const s=Store.state, why=[];
    if(!s) return ['אין נתונים כלל'];
    if(!s.tasks||!s.tasks.length) why.push('אין משימות');
    if(!s.meta||!s.meta.weddingDate) why.push('אין תאריך חתונה');
    if(!s.venue||!s.venue.pricePerPlate) why.push('אין מחיר מנה');
    return why;
  },

  setStatus(s){
    this.status=s;
    const el=document.getElementById('syncPill');
    if(!el) return;
    const map={ok:['✓','var(--good-2)','מסונכרן'],syncing:['⟳','var(--brand-2)','מסנכרן…'],
                error:['⚠','var(--bad-2)',this.lastError||'שגיאה'],
                idle:['⟳','var(--ink-3)','ממתין'],off:['','','']};
    const [icon,colour,label]=map[s]||map.off;
    el.style.display=this.on?'flex':'none';
    el.style.color=colour; el.title=label; el.textContent=icon;
  },

  async start(){
    if(!this.on) return;
    this.stop();
    this.seedSnapshot();
    this.coldChanged();
    await this.run();
    this.timer=setInterval(()=>{ if(!document.hidden) this.run(); },POLL_MS);
  },
  stop(){ clearInterval(this.timer); this.timer=null; },
  nudge(){ if(this.on){ clearTimeout(this._n); this._n=setTimeout(()=>this.run(),1500); } },
};

const $=s=>document.querySelector(s);

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-act]'); if(!b) return;

  if(b.id==='toastAct'){
    const fn=undoFn; undoFn=null;
    document.getElementById('toast').classList.remove('on');
    if(fn) fn();
    return;
  }

  if(b.dataset.v){
    active=b.dataset.v;
    if(b.dataset.grsvpgo!==undefined) ui.guestRsvp=b.dataset.grsvpgo;
    render(); window.scrollTo(0,0);
    if(b.dataset.grsvpgo!==undefined)
      document.getElementById('guestList')?.scrollIntoView({block:'start'});
    return;
  }
  if(b.dataset.grsvpgo!==undefined){
    ui.guestRsvp=b.dataset.grsvpgo;
    render();
    document.getElementById('guestList')?.scrollIntoView({block:'start'});
    return;
  }
  if(b.dataset.bview!==undefined){ ui.budgetView=b.dataset.bview; render(); return; }
  if(b.dataset.gside!==undefined){ ui.guestSide=b.dataset.gside; render(); return; }
  if(b.dataset.grsvp!==undefined){ ui.guestRsvp=ui.guestRsvp===b.dataset.grsvp?'':b.dataset.grsvp; render(); return; }
  if(b.dataset.gfilter){ ui.giftFilter=ui.giftFilter===b.dataset.gfilter?'':b.dataset.gfilter; render(); return; }
  if(b.dataset.gsort){ ui.giftSort=b.dataset.gsort; render(); return; }
  if(b.dataset.gmore){ ui.giftMore.add(b.dataset.gmore); render(); return; }
  if(b.dataset.tf){ ui.taskFilter=b.dataset.tf; render(); return; }
  if(b.dataset.sc){ const [p,c]=b.dataset.sc.split(',').map(Number);
    ui.prime=p; ui.cpi=c;
    return Store.update(s=>{ if(s.capital){ s.capital.prime=p; s.capital.cpi=c; } }); }

  if(b.dataset.rsvpset!==undefined){
    const i=+b.dataset.gi, want=b.dataset.rsvpset;
    return Store.update(s=>{ const g=s.guests[i]; g.rsvp=g.rsvp===want?'pending':want; });
  }
  if(b.dataset.inv!==undefined) return Store.update(s=>{
    const g=s.guests[+b.dataset.inv]; g.invitationSent=!g.invitationSent; });

  if(b.dataset.gedit!==undefined) return openGuestDlg(+b.dataset.gedit);

  if(b.dataset.gr!==undefined){
    const i=+b.dataset.gr, k=+b.dataset.gk||0;
    const prev=giftSnapSlot(giftsOf(Store.state.guests[i])[k]||{});
    Store.update(s=>{
      writeGift(s.guests[i], k, {received:!prev.received, date:!prev.received?todayISO():null});
    });
    return toastUndo(prev.received?'בוטל סימון התקבל':'סומן כהתקבל',
      ()=>Store.update(s=>writeGift(s.guests[i], k, prev)));
  }

  if(b.dataset.td!==undefined) return Store.update(s=>{
    const t=s.tasks[+b.dataset.td]; t.status=t.status==='done'?'open':'done'; });

  if(b.dataset.pay!==undefined) return addPayment(+b.dataset.pay);

  if(b.dataset.delpay){
    const [i,j]=b.dataset.delpay.split('.').map(Number);
    const p=Store.state.vendors[i].payments[j];
    if(!confirm(`למחוק את ${p&&p.planned?'התשלום המתוכנן':'התשלום'} על ${money(p&&p.amount)}?`)) return;
    return Store.update(s=>{ s.vendors[i].payments.splice(j,1); });
  }

  if(b.dataset.delloan){
    const [k,i]=b.dataset.delloan.split('.');
    const nm=Store.state.capital[k].loans[+i].name;
    if(!confirm(`למחוק את ההלוואה «${nm}»?`)) return;
    return Store.update(s=>{ s.capital[k].loans.splice(+i,1); });
  }
  if(b.dataset.addslip) return openSlipDlg(b.dataset.addslip);
  if(b.dataset.delslip){
    const id=b.dataset.delslip;
    const s=(Store.state.capital.slips||[]).find(x=>x.id===id);
    if(!s||!confirm(`למחוק את תלוש ${periodLabel(s.period)}?`)) return;
    Store.update(st=>{ st.capital.slips=st.capital.slips.filter(x=>x.id!==id); });
    if($('#slipDbDlg').open) openSlipDb();
    return;
  }
  if(b.dataset.editslip){
    const s=liveSlips().find(x=>x.id===b.dataset.editslip);
    if(!s) return;
    if($('#slipDbDlg').open) $('#slipDbDlg').close();
    return openSlipDlg(s.person,s);
  }

  if(b.dataset.addloan) return addLoan(b.dataset.addloan);

  if(b.dataset.addfix){
    const name=prompt('שם ההוצאה הקבועה:'); if(!name) return;
    const amount=Number(prompt('סכום חודשי (₪):','1000')); if(!amount) return;
    return Store.update(s=>{
      (s.capital[b.dataset.addfix].fixedExpenses ||= [])
        .push({id:'f'+Date.now(),name:name.trim(),amount});
    });
  }
  if(b.dataset.delfix){
    const [k,i]=b.dataset.delfix.split('.');
    const f=Store.state.capital[k].fixedExpenses[+i];
    if(!confirm(`למחוק את «${f.name}»?`)) return;
    return Store.update(s=>{ s.capital[k].fixedExpenses.splice(+i,1); });
  }
  if(b.dataset.addfixin){
    const name=prompt('שם ההכנסה הקבועה:'); if(!name) return;
    const amount=Number(prompt('סכום חודשי (₪):','1000')); if(!amount) return;
    return Store.update(s=>{
      (s.capital[b.dataset.addfixin].fixedIncomes ||= [])
        .push({id:'in'+Date.now(),name:name.trim(),amount});
    });
  }
  if(b.dataset.delfixin){
    const [k,i]=b.dataset.delfixin.split('.');
    const f=Store.state.capital[k].fixedIncomes[+i];
    if(!confirm(`למחוק את «${f.name}»?`)) return;
    return Store.update(s=>{ s.capital[k].fixedIncomes.splice(+i,1); });
  }

  if(b.dataset.markpaid){
    const [vi,pi]=b.dataset.markpaid.split('.').map(Number);
    const prev=Object.assign({},Store.state.vendors[vi].payments[pi]);
    Store.update(s=>{ const p=s.vendors[vi].payments[pi]; p.planned=false; if(!p.date||p.date>todayISO()) p.date=todayISO(); });
    return toastUndo(`סומן כשולם · ${money(prev.amount)}`,()=>Store.update(s=>{ s.vendors[vi].payments[pi]=prev; }));
  }

  if(b.dataset.act) return dataAction(b.dataset.act);
});

const CALC_FIELDS={cAm:'amount',cMo:'months',cGr:'grace',cSpr:'spread',cRT:'rt',cTy:'ty'};

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='guestGroup'){ ui.guestGroup=t.value; return render(); }

  if(t.id==='prime'){ ui.prime=Number(t.value);
    return Store.update(s=>{ if(s.capital) s.capital.prime=ui.prime; }); }
  if(t.id==='cpi'){ ui.cpi=Number(t.value);
    return Store.update(s=>{ if(s.capital) s.capital.cpi=ui.cpi; }); }
  if(t.id==='fcRet'){ ui.fc.ret=Number(t.value); return render(); }
  if(t.id==='fcGrowth'){ ui.fc.growth=Number(t.value); return render(); }
  if(t.id==='fcYears'){ ui.fc.years=Number(t.value); return render(); }
  if(CALC_FIELDS[t.id]){
    const key=CALC_FIELDS[t.id];
    ui.calc[key]=(key==='rt'||key==='ty')?t.value:(Number(t.value)||0);
    return render();
  }

  if(t.dataset.rsvp!==undefined) return Store.update(s=>{ s.guests[+t.dataset.rsvp].rsvp=t.value; });
  if(t.dataset.gm!==undefined){
    const i=+t.dataset.gm, k=+t.dataset.gk||0;
    refocus=`button[data-gr="${i}"][data-gk="${k}"]`;
    return Store.update(s=>writeGift(s.guests[i], k, {method:t.value||null}));
  }

  if(t.classList.contains('giftamt')){
    const i=+t.dataset.gi, k=+t.dataset.gk||0;
    refocus=`select[data-gm="${i}"][data-gk="${k}"]`;
    const prev=giftSnapSlot(giftsOf(Store.state.guests[i])[k]||{});
    const v=t.value===''?null:Number(t.value);
    if(v===prev.amount || (v==null && prev.amount==null)) return;
    Store.update(s=>{
      writeGift(s.guests[i], k, {amount:v, date:v!=null?(prev.date||todayISO()):prev.date});
    });
    return toastUndo('נרשמה מתנה '+money(v),
      ()=>Store.update(s=>writeGift(s.guests[i], k, prev)));
  }
  if(t.classList.contains('celltxt')){
    const v=t.value||null;
    return Store.update(()=>setPath(t.dataset.path,v));
  }
  if(t.classList.contains('cellnum')){
    const v=t.value===''?null:Number(t.value);
    return Store.update(()=>setPath(t.dataset.path,v));
  }
  if(t.classList.contains('loanedit')){
    const v=t.type==='date'?(t.value||null):(t.value===''?0:Number(t.value));
    return Store.update(s=>{
      setPath(t.dataset.lp,v);
      // The doc{} block quotes the bank paperwork; once the terms are edited
      // it no longer describes this loan, so the computed figures take over.
      const m=t.dataset.lp.match(/^capital\.(\w+)\.loans\.(\d+)\./);
      if(m) delete s.capital[m[1]].loans[+m[2]].doc;
    });
  }
});

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.position='fixed'; ta.style.insetInlineStart='-9999px';
      document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}
