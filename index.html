/* ================================================================= EXPORT  *
 * One report, two shapes. Excel is a real .xlsx (SheetJS, fetched from the
 * CDN on first use) with three sheets; PDF goes through the browser's print
 * dialog, which is the only dependency-free way to get Hebrew RTL into a PDF
 * on a phone -- «שמירה כ־PDF» is one tap away in that dialog.
 * ========================================================================== */
// Before the wedding a row «confirms»; after it, it «came». Same field.
function rsvpWords(){
  const after=Store.state&&calc.daysLeft()<0;
  return after
    ? {yes:'הגיעו',no:'לא הגיעו',pend:'לא ידוע',yes1:'הגיע/ה',no1:'לא הגיע/ה',pend1:'לא ידוע',avgAll:'ממוצע על כל מי שהגיע',who:'הגיעו'}
    : {yes:'מאושרים',no:'לא מגיעים',pend:'ממתינים',yes1:'מגיע/ה',no1:'לא מגיע/ה',pend1:'ממתין/ה',avgAll:'ממוצע על כל מי שאישר',who:'אישרו'};
}
function rsvpLabel(g){ const W=rsvpWords();
  return g.rsvp==='confirmed'?W.yes1:g.rsvp==='declined'?W.no1:W.pend1; }
function reportData(){
  const t=calc.totals(), h=calc.headcount(), gs=giftStats(), m$=moneySummary(), W=rsvpWords();
  const m=Store.state.meta||{}, n=NAMES(), V=Store.state.venue||{};
  const guests=[...liveGuests()].sort((a,b)=>(a.name||'').localeCompare(b.name||'','he')).map(g=>{
    const slots=giftsOf(g).filter(x=>Number(x.amount)>0);
    const total=giftTotal(g), seat=calc.seatCost(g);
    return {
      'שם':g.name||'', 'צד':g.side||g.list||'', 'קבוצה':g.group||'', 'טלפון':g.phone||'',
      'מבוגרים':g.adults||0, 'ילדים':g.children||0, 'הגעה':rsvpLabel(g),
      'מתנה':total||'', 'אמצעי':[...new Set(slots.map(x=>methodHe(x.method)).filter(Boolean))].join(', '),
      'התקבל':slots.length?(slots.every(x=>x.received)?'כן':'חלקית'):'', 'תאריך':slots.map(x=>x.date).filter(Boolean)[0]||'',
      'עלות מנות':g.rsvp==='declined'?0:(seat||''), 'נטו':total?(g.rsvp==='declined'?total:total-seat):'', 'לאורח':total&&g.adults>1&&g.rsvp!=='declined'?Math.round(total/g.adults):'',
      'הערות':g.notes||'',
    };
  });
  const vendors=[];
  liveVendors().forEach(v=>{
    const paid=calc.paidOf(v), rem=calc.remainOf(v);
    vendors.push({'ספק':v.name,'עלות':v.total??'','שולם':paid,'מכוסה':v.coveredAmount||'','מי מכסה':v.coveredBy||'','נשאר':rem,
      'אמצעי ליתרה':methodHe(v.payMethod),'מועד ליתרה':v.payDue||'','הערות':v.notes||''});
    (v.payments||[]).forEach(p=>vendors.push({'ספק':'   ↳ '+(p.planned?'מתוכנן':'שולם'),'עלות':'','שולם':p.planned?'':p.amount,'מכוסה':'','מי מכסה':'',
      'נשאר':p.planned?p.amount:'','אמצעי ליתרה':methodHe(p.method),'מועד ליתרה':p.date||'','הערות':[p.deposit?'פיקדון':'',p.note||''].filter(Boolean).join(' · ')}));
  });
  const summary=[
    ['החתונה של',`${n.groom} & ${n.bride}`],['תאריך',dmy(m.weddingDate)],['מקום',m.venueName||''],['הופק',new Date().toLocaleString('he-IL')],
    [],
    ['מוזמנים (מקומות)',h.invited],[W.yes,h.confirmed],[W.no,h.declined],[W.pend,h.pending],['שורות הזמנה',h.rows],['ילדים',h.kids],
    [],
    ['סה״כ עלות החתונה',t.cost],['שילמנו עד כה',t.paid],['מכוסה על ידי אחרים',t.covered],['נשאר לשלם',t.remaining],['מתוכנן',m$.planned],['בלי מועד',m$.unplanned],
    [],
    ['מתנות שנרשמו',t.gifts],['מתנות שהתקבלו',t.giftsIn],['מזה מההורים',m$.parents],['מזה מאורחים',gs.total],
    ['משפחות שנתנו',gs.rows],['מעטפות',gs.envelopes],['ממוצע לאורח שנתן',Math.round(gs.perSeat)],
    ['אורחים שהביאו מתנה (מקומות)',gs.coveredSeats],['מתוך אורחים ש'+W.who,gs.confirmedSeats],['עוד לא הביאו (אורחים / משפחות)',`${gs.notYetSeats} / ${gs.notYet}`],
    ['מחיר מנה',gs.plate],['נטו לאורח מול מנה',Math.round(gs.perSeat-gs.plate)],
    [],
    ['מאזן — מתנות פחות כל העלויות',t.giftsIn-t.paid-t.remaining],
  ];
  return {summary,guests,vendors,W};
}
async function exportXlsx(){
  toast('מכין קובץ אקסל…');
  try{
    if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const R=reportData(), X=window.XLSX, wb=X.utils.book_new();
    wb.Workbook={Views:[{RTL:true}]};
    const ws1=X.utils.aoa_to_sheet(R.summary); ws1['!cols']=[{wch:30},{wch:22}];
    const ws2=X.utils.json_to_sheet(R.guests);

    X.utils.book_append_sheet(wb,ws1,'סיכום');
    X.utils.book_append_sheet(wb,ws2,'אורחים ומתנות');
    X.utils.book_append_sheet(wb,ws3,'ספקים ותשלומים');
    X.writeFile(wb,`ourmoney-${todayISO()}.xlsx`);
    toast('קובץ האקסל ירד');
  }catch(e){ toast('ייצוא נכשל: '+(e.message||e)); }
}

async function dataAction(act){
  const dlg=$('#dataDlg');
  if(act==='close') return dlg.close();

  if(act==='task-new'){
    $('#topicList').innerHTML=[...new Set((Store.state.tasks||[]).map(t=>t.topic).filter(Boolean))]
      .sort().map(x=>`<option value="${esc(x)}">`).join('');
    $('#tNew').value=''; $('#tTopic').value=''; $('#tDue').value='';
    $('#taskDlg').showModal();
    return;
  }
  if(act==='task-cancel') return $('#taskDlg').close();

  if(act==='vendor-new'){
    ['vnName','vnTotal','vnDue','vnNotes'].forEach(id=>$('#'+id).value='');
    $('#vnMethod').value=''; $('#vnPaid').checked=false;
    $('#vendorDlg').showModal(); setTimeout(()=>$('#vnName').focus(),50);
    return;
  }
  if(act==='vendor-cancel') return $('#vendorDlg').close();
  if(act==='vendor-save'){
    const name=$('#vnName').value.trim();
    if(!name) return toast('חסר שם להוצאה');
    const total=$('#vnTotal').value===''?null:Number($('#vnTotal').value);
    const method=$('#vnMethod').value||null, due=$('#vnDue').value||null;
    const notes=$('#vnNotes').value.trim()||null, paid=$('#vnPaid').checked;
    if(paid&&!total) return toast('כדי לסמן «שולם» צריך עלות');
    // ids follow the importer's convention: final letters normalised, unique.
    const base=name.replace(/[םןץףך]/g,c=>({'ם':'מ','ן':'נ','ץ':'צ','ף':'פ','ך':'כ'}[c]));
    const id=Store.state.vendors.some(v=>v.id===base)?base+' · '+Date.now():base;
    Store.update(s=>{ s.vendors.push({
      id, name, category:null, total, advanceRequired:false, dueWhen:null,
      coveredBy:null, coveredAmount:0, notes, payMethod:method, payDue:due,
      payments: paid?[{id:(crypto.randomUUID?crypto.randomUUID():'p'+Date.now()),amount:total,method,
                       date:due||todayISO(),note:null,planned:false,deposit:false}]:[],
    }); });
    $('#vendorDlg').close();
    return toast(`«${name}» נוסף${total?` · ${money(total)}`:''}${paid?' · שולם':''}`);
  }
  if(act==='pay-cancel') return $('#payDlg').close();
  if(act==='pay-save'){
    const vi=Number($('#pyVendor').value), amt=Number($('#pyAmt').value);
    if(!amt) return toast('חסר סכום');
    const method=$('#pyMethod').value||null, date=$('#pyDate').value||null;
    const note=$('#pyNote').value.trim()||null, paid=$('#pyPaid').checked, dep=$('#pyDep').checked;
    Store.update(s=>{
      s.vendors[vi].payments.push({
        id:(crypto.randomUUID?crypto.randomUUID():'p'+Date.now()),
        amount:amt, method, date:paid?(date||todayISO()):date, note, planned:!paid, deposit:dep,
      });
    });
    $('#payDlg').close();
    return toast(paid?`נרשם תשלום ${money(amt)}`:`תוכנן ${money(amt)}${date?` · ${dLabel(date)}`:''}`);
  }
  if(act==='task-save'){
    const title=$('#tNew').value.trim();
    if(!title) return toast('חסר תיאור למשימה');
    const topic=$('#tTopic').value.trim()||'כללי';
    const due=$('#tDue').value||null;
    Store.update(s=>{ s.tasks.push({
      id:(crypto.randomUUID?crypto.randomUUID():'t'+Date.now()+Math.random().toString(36).slice(2)),
      topic, title, status:'open', dueDate:due, daysBefore:null,
      owner:null, notes:null, source:'נוסף באפליקציה',
    }); });
    $('#taskDlg').close();
    return toast('המשימה נוספה'+(due?` · יעד ${dLabel(due)}`:''));
  }

  if(act==='slip-cam') return $('#slipCam').click();
  if(act==='slip-file') return $('#slipPick').click();
  if(act==='slip-cancel'){ clearSlipPreview(); return $('#slipDlg').close(); }
  if(act==='slipdb-open') return openSlipDb();
  if(act==='slipdb-close') return $('#slipDbDlg').close();
  if(act==='slipdb-csv') return slipsCsv();
  if(act==='slip-save'){
    const rec=readSlipForm();
    if(!rec.period) return toast('חסר חודש');
    if(rec.gross==null&&rec.net==null) return toast('חסר ברוטו או נטו');
    rec.id=rec.person+'-'+rec.period;
    Store.update(s=>{
      s.capital.slips=s.capital.slips||[];
      const i=s.capital.slips.findIndex(x=>x.person===rec.person&&x.period===rec.period);
      if(i>=0) s.capital.slips[i]=Object.assign({},s.capital.slips[i],rec);
      else s.capital.slips.push(rec);
      const d=s.capital[rec.person];
      if(d){
        d.income=d.income||{gross:null,net:null};
        if(rec.gross!=null) d.income.gross=rec.gross;
        if(rec.net!=null) d.income.net=rec.net;
      }
    });
    clearSlipPreview();
    $('#slipDlg').close();
    return toast('התלוש נשמר');
  }

  if(act==='hall-on') return setHall(true);
  if(act==='hall-off') return setHall(false);
  if(act==='export-rsvp') return exportRsvp();
  if(act==='export-xlsx') return exportXlsx();
  if(act==='export-pdf') return exportPdf();
  if(act==='guest-new') return openGuestDlg(-1);
  if(act==='guest-cancel') return $('#guestDlg').close();
  if(act==='guest-save'){
    const name=$('#gName').value.trim();
    if(!name) return toast('חסר שם');
    const side=$('#gSide').value||'חתן';
    const group=$('#gGroup').value.trim()||null;
    const adults=Number($('#gAd').value); const ad=Number.isFinite(adults)?adults:1;
    const children=Number($('#gCh').value)||0;
    const phone=$('#gPhone').value.trim()||null;
    const notes=$('#gNotes').value.trim()||null;
    const idx=$('#gIdx').value===''?-1:Number($('#gIdx').value);
    Store.update(s=>{
      if(idx>=0 && s.guests[idx]){
        const g=s.guests[idx];
        g.name=name; g.side=side; g.list=g.list||side; g.group=group;
        g.adults=ad; g.children=children; g.phone=phone; g.notes=notes;
      }else{
        s.guests.push({
          id:newGuestId(name), name, side, list:side, group,
          adults:ad, children, phone, email:null, address:null, notes,
          invitationSent:false, rsvp:'pending',
          gift:{amount:null,method:null,received:false,date:null,note:null},
          expectedCheck:null,
        });
      }
    });
    $('#guestDlg').close();
    return toast(idx>=0?'האורח עודכן':'האורח נוסף');
  }
  if(act==='guest-del'){
    const idx=Number($('#gIdx').value);
    const g=Store.state.guests[idx];
    if(!g||!confirm(`למחוק את «${g.name}» מהרשימה?`)) return;
    Store.update(s=>{ s.guests[idx]._deleted=true; });
    $('#guestDlg').close();
    return toast('האורח הוסר');
  }

  if(act==='gh-save'){
    const t=$('#ghTok').value.trim();
    // Always re-query #ghErr: syncPanel() rebuilds the panel, and a message
    // written to the old node vanishes -- which made every failure look like
    // the button simply did nothing.
    const say=m=>{ const e=$('#ghErr'); if(e) e.textContent=m; };
    if(!t) return say('חסר אסימון');
    say('מתחבר…');
    try{ Sync.saveToken(t); }
    catch(e){ return say('המכשיר חוסם שמירה מקומית: '+e.message); }
    try{
      // A token that was not granted access to the data repo returns 404 on
      // every call -- the same answer as "no file yet" -- so without this
      // check it "connects" silently with zero data.
      const repo=await Sync.api(`repos/${Sync.repo}`);
      if(!repo){
        Sync.forget(); syncPanel();
        return say(`לאסימון אין גישה ל־${Sync.repo}. ביצירת האסימון: `+
          `Repository access → Only select repositories → ourmoney-data, `+
          `וגם Permissions → Contents → Read and write`);
      }
      await Sync.start();
      if(Sync.lastError){ const msg=Sync.lastError; Sync.forget(); syncPanel(); return say(msg); }
      syncPanel(); render();
      toast(Store.state?`מסונכרן · ${Store.state.guests.length} אורחים`:'מחובר');
    }catch(e){ Sync.forget(); syncPanel(); say(e.message); }
    return;
  }
  if(act==='gh-forget'){ Sync.forget(); render(); return syncPanel(); }
  if(act==='gh-now'){ await Sync.run(); syncPanel(); return toast(Sync.lastError||'סונכרן'); }
  if(act==='gh-pull'){
    const box=$('#sbDiag'); if(box) box.innerHTML='<p class="note">מוריד…</p>';
    try{
      const r=await Sync.fetchRemote();
      if(!r) throw new Error('אין קובץ בשרת');
      Store.state=r; Store.migrate(); Store.saveNow(); Sync.seedSnapshot(); render();
      if(box) box.innerHTML='';
      toast(`ירדו ${Store.state.guests.length} אורחים · ${Store.state.tasks.length} משימות`);
    }catch(e){ if(box) box.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; }
    return syncPanel();
  }
  if(act==='gh-upload'){
    const gaps=Sync.looksPartial();
    if(gaps.length&&!confirm('הנתונים כאן נראים חלקיים —\n· '+gaps.join('\n· ')+
        '\n\nהעלאה תדרוס את השרת. להמשיך?')) return;
    const box=$('#sbDiag'); if(box) box.innerHTML='<p class="note">מעלה…</p>';
    try{ await Sync.uploadAll(); if(box) box.innerHTML=
      '<div class="warnbox" style="background:var(--good-dim);border-color:var(--good);color:var(--good-2)">הועלה בהצלחה ✓</div>'; }
    catch(e){ if(box) box.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; }
    return;
  }
  if(act==='gh-diag'){
    const box=$('#sbDiag'); box.innerHTML='<p class="note">בודק…</p>';
    try{
      const d=await Sync.diagnose();
      const he={guests:'אורחים',vendors:'ספקים',tasks:'משימות',payments:'תשלומים'};
      if(!d.server){ box.innerHTML='<div class="warnbox">אין עדיין קובץ בשרת</div>'; return; }
      box.innerHTML=`<table style="margin-top:.6rem"><thead><tr>
          <th>טבלה</th><th class="num">במכשיר</th><th class="num">בשרת</th></tr></thead><tbody>
        ${Object.keys(he).map(k=>{
          const l=d.local?d.local[k]:0, sv=d.server[k];
          const ok=l===sv&&sv>0;
          return `<tr><td>${he[k]}</td>
            <td class="num" style="color:${l>0?'var(--ink)':'var(--bad-2)'}">${l}</td>
            <td class="num" style="color:${ok?'var(--good-2)':'var(--bad-2)'}">${sv}</td></tr>`;
        }).join('')}
        <tr><td>תאריך חתונה בשרת</td><td class="num">—</td>
          <td class="num" style="color:${d.serverDate?'var(--good-2)':'var(--bad-2)'}">
          ${esc(d.serverDate||'חסר')}</td></tr>
        </tbody></table>`;
    }catch(e){ box.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; }
    return;
  }

  if(act==='export'){ Store.backup('ייצוא ידני'); return Store.exportFile(); }
  if(act==='import') return $('#fileIn').click();
  if(act==='reset'){
    if(!confirm('לאפס את כל הנתונים חזרה למה שהיה באקסל?\nכל המתנות והתשלומים שהוזנו כאן יימחקו.\nמומלץ לייצא גיבוי קודם.')) return;
    Store.backup('לפני איפוס');
    Store.state=structuredClone(window.SEED); Store.migrate(); Store.saveNow(); render();
    return toast('אופס לנתוני האקסל');
  }
  if(act==='restore'){
    const list=Store.backups();
    if(!list.length) return toast('אין גיבויים');
    const pick=prompt('איזה גיבוי לשחזר?\n'+
      list.map((b,i)=>`${i+1}. ${new Date(b.ts).toLocaleString('he-IL')} — ${b.reason}`).join('\n'),'1');
    const i=Number(pick)-1;
    if(!(i>=0&&i<list.length)) return;
    try{ Store.importObj(JSON.parse(list[i].json)); dlg.close(); }
    catch(e){ toast('שחזור נכשל: '+e.message); }
  }
}

function syncPanel(){
  const el=$('#syncPanel'); if(!el) return;
  if(!Sync.on){
    el.innerHTML=`
      <p class="note" style="margin-bottom:.6rem">
        הנתונים נשמרים ב־repo פרטי: <b dir="ltr">${esc(Sync.repo)}</b>.
        צריך אסימון גישה פעם אחת בכל מכשיר.</p>
      <details class="acc" open><summary>איך מייצרים אסימון (30 שניות)</summary><div>
        <ol class="note" style="padding-inline-start:1.1rem;line-height:1.9">
          <li>נכנסים ל־<a href="https://github.com/settings/personal-access-tokens/new"
              target="_blank" rel="noopener" dir="ltr">github.com/settings/personal-access-tokens/new</a></li>
          <li><b>Token name:</b> <code dir="ltr">ourmoney</code></li>
          <li><b>Expiration:</b> 90 days</li>
          <li><b>Repository access:</b> Only select repositories →
              <code dir="ltr">ourmoney-data</code></li>
          <li><b>Permissions</b> → Repository permissions →
              <b>Contents</b> → <code dir="ltr">Read and write</code></li>
          <li>Generate token → להעתיק (מתחיל ב־<code dir="ltr">github_pat_</code>)</li>
        </ol>
        <p class="note" style="color:var(--warn-2)">
          האסימון נשמר במכשיר הזה בלבד. אין לשלוח אותו לאף אחד — אם נחשף,
          מוחקים אותו באותו עמוד ומייצרים חדש.</p>
      </div></details>
      <label class="fld" style="margin:.6rem 0"><span>GitHub token</span>
        <input type="password" id="ghTok" dir="ltr" placeholder="github_pat_…"
               autocomplete="off"></label>
      <button class="btn btn-p" style="width:100%" data-act="gh-save">חיבור</button>
      <p class="note" id="ghErr" style="color:var(--bad-2);margin-top:.5rem"></p>`;
    return;
  }
  const st={ok:'מסונכרן',syncing:'מסנכרן…',error:'שגיאה: '+(Sync.lastError||''),
             idle:'ממתין',off:'כבוי'}[Sync.status]||'';
  el.innerHTML=`
    <p class="note" style="margin-bottom:.6rem">
      מחובר אל <b dir="ltr">${esc(Sync.repo)}</b><br>סטטוס: ${esc(st)}</p>
    <button class="btn btn-o" style="width:100%" data-act="gh-now">סנכרון עכשיו</button>
    <button class="btn btn-o" style="width:100%;margin-top:.4rem" data-act="gh-pull">משיכה מהשרת</button>
    <button class="btn btn-o" style="width:100%;margin-top:.4rem" data-act="gh-diag">בדיקה: מה יש בשרת</button>
    <div id="sbDiag"></div>
    <button class="btn btn-o" style="width:100%;margin-top:.4rem" data-act="gh-upload">העלאת הכול לשרת</button>
    <button class="btn btn-d" style="width:100%;margin-top:.4rem" data-act="gh-forget">ניתוק</button>`;
}

document.getElementById('dataBtn').onclick=()=>{
  const b=Store.backups();
  $('#dataMeta').innerHTML=
    `<b>גרסה ${BUILD}</b><br>`+
    `גיבויים אוטומטיים: ${b.length}${b.length?` · אחרון ${new Date(b[0].ts).toLocaleString('he-IL')}`:''}<br>`+
    (Sync.on?'הנתונים מסונכרנים בין המכשירים.'
            :'הנתונים נשמרים בדפדפן הזה בלבד. כדי להעביר למכשיר אחר — ייצאו JSON.');
  $('#dataDlg [data-act=reset]').hidden=!window.SEED;
  syncPanel();
  $('#dataDlg').showModal();
};

document.getElementById('fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ Store.importObj(JSON.parse(r.result)); $('#dataDlg').close(); }
                 catch(err){ alert('ייבוא נכשל: '+err.message); } };
  r.readAsText(f);
  e.target.value='';
};

const onSlipFile=e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(f) ingestSlipFile(f);
};
document.getElementById('slipCam').onchange=onSlipFile;
document.getElementById('slipPick').onchange=onSlipFile;
document.getElementById('slipDlg').addEventListener('close',clearSlipPreview);

/* -------------------------------------------------------------- theme, go  */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content=t==='light'?'#f8f3ee':'#131016';
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
}
document.getElementById('themeBtn').onclick=()=>
  applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
try{ applyTheme(localStorage.getItem(THEME_KEY)||
     (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')); }catch(e){}

addEventListener('beforeunload',()=>{ if(Store.state) Store.saveNow(); });

// A rejected promise nobody awaited used to die in silence; on a phone that
// reads as "the button does nothing". Surface it.
addEventListener('unhandledrejection',e=>{
  toast('שגיאה: '+((e.reason&&e.reason.message)||e.reason||'לא ידועה'));
});

/* ------------------------------------------------------------ auto-update  *
 * iOS home-screen apps keep serving a cached copy long after a new build is
 * published; data syncs but the UI stays old. Poll our own URL and offer a
 * one-tap reload when the served BUILD differs from the running one.
 */
async function checkUpdate(){
  if(location.protocol==='file:') return;
  try{
    const r=await fetch(location.href,{cache:'no-store'});
    const m=(await r.text()).match(/BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD&&!document.getElementById('updBar')){
      const d=document.createElement('div');
      d.id='updBar';
      d.style.cssText='position:fixed;inset-inline:0;top:calc(env(safe-area-inset-top) + 56px);'+
        'z-index:98;display:flex;justify-content:center;pointer-events:none';
      d.innerHTML=`<button style="pointer-events:auto;background:var(--brand);color:var(--on-brand);`+
        `border-radius:999px;padding:.5rem 1.1rem;font-weight:700;font-size:.85rem;`+
        `box-shadow:var(--shadow)">יש גרסה חדשה (${esc(m[1])}) — לחצו לרענון</button>`;
      d.querySelector('button').onclick=()=>location.reload();
      document.body.appendChild(d);
    }
  }catch(e){ /* offline — try again next round */ }
}
setInterval(checkUpdate,10*60*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
checkUpdate();

// The hosted build has no data.js, so <html dir> may not be ours to set.
document.documentElement.dir='rtl';
document.documentElement.lang='he';

const booted=Store.boot();
try{ ui.hall=localStorage.getItem(HALL_KEY)==='1'; }catch(e){}
if(ui.hall){ document.body.classList.add('hall'); active='guests'; }
if(booted) Store.backup('פתיחת אפליקציה');
render();

Sync.load();
Sync.setStatus(Sync.status);
if(Sync.on) Sync.start();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) Sync.nudge(); });
</script>
